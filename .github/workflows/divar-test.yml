name: Test Divar Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test Divar
        run: |
          node test-divar.js > divar-test-output.txt 2>&1
          cat divar-test-output.txt

      - name: Upload Divar Output
        uses: actions/upload-artifact@v4
        with:
          name: divar-test-output
          path: divar-test-output.txt
