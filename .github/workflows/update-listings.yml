name: Update Avrin Listings

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: avrin-listings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect Divar listings (Tehran 150-listing test)
        env:
          AVRIN_CITY: tehran
          AVRIN_MAX_LINKS: 150
        run: node divar-collector.js

      - name: Validate listings
        run: |
          set -e
          test -f data/listings.json
          jq empty data/listings.json

          echo "Total:"
          jq 'length' data/listings.json

          echo "Personal:"
          jq '[.[] | select(.sellerType == "personal")] | length' data/listings.json

          echo "Age <= 14 days:"
          jq '[.[] | select(.ageHours <= 336)] | length' data/listings.json

          echo "With area:"
          jq '[.[] | select(.area != null)] | length' data/listings.json

          echo "With rooms:"
          jq '[.[] | select(.rooms != null)] | length' data/listings.json

          echo "With build year:"
          jq '[.[] | select(.buildYear != null)] | length' data/listings.json

          echo "With floor:"
          jq '[.[] | select(.floor != null)] | length' data/listings.json

          echo "With units:"
          jq '[.[] | select(.units != null)] | length' data/listings.json

      - name: Show sample
        run: jq '.[0:5]' data/listings.json

      - name: Commit listings
        run: |
          set -e
          git config user.name "Avrin Bot"
          git config user.email "avrin-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Avrin listings"
            git push
          fi
