name: Update Avrin Listings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch listings from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p data

          curl -s -X POST \
            "https://api.apify.com/v2/acts/hipersoft~divar-scraper/run-sync-get-dataset-items?token=${APIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "city": "tehran",
              "maxItems": 100
            }' \
            -o data/listings.json

      - name: Commit listings
        run: |
          git config user.name "Avrin Bot"
          git config user.email "avrin-bot@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Update Avrin listings"
          git push
