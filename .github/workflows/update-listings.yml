name: Avrin Manual Listings Refresh

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: avrin-manual-listings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect latest Divar listings
        env:
          AVRIN_MAX_LINKS: 20
          AVRIN_DETAIL_CONCURRENCY: 2
          AVRIN_DETAIL_DELAY_MS: 1500
        run: node divar-collector.js
      - name: Validate archive
        run: |
          set -e
          test -f data/listings.json
          test -f data/listings-meta.json
          jq empty data/listings.json
          jq empty data/listings-meta.json
          echo "Listings:"
          jq 'length' data/listings.json
          echo "Personal:"
          jq '[.[] | select(.sellerType == "personal")] | length' data/listings.json
          echo "Recent:"
          jq '[.[] | select(.ageHours == null or .ageHours <= 336)] | length' data/listings.json
      - name: Publish Avrin archive
        run: |
          set -e
          git config user.name "Avrin Bot"
          git config user.email "avrin-bot@users.noreply.github.com"
          git add data/listings.json data/listings-meta.json data/cities.json
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Refresh Avrin property archive"
            git push
          fi