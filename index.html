<!doctype html>
<html lang="fa" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار مشاور املاک اورین نکسوس</title>

<style>
:root{
--bg:#0b1017;
--panel:#111923;
--panel2:#172331;
--line:#263547;
--text:#edf3f8;
--muted:#91a2b5;
--accent:#46c6a7;
--accent2:#2aa88c;
--danger:#e47a7a
}

*{box-sizing:border-box}

body{
margin:0;
background:#070b10;
color:var(--text);
font-family:Tahoma,"Segoe UI",sans-serif
}

.app{
min-height:100vh;
background:linear-gradient(145deg,#0b1017,#0d141d 55%,#101a23);
padding:28px 16px
}

.wrap{
max-width:850px;
margin:auto
}

.head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.brand{
display:flex;
gap:12px;
align-items:center
}

.logo{
width:42px;
height:42px;
border:1px solid #3b5a67;
border-radius:12px;
display:grid;
place-items:center;
color:var(--accent);
font-weight:800
}

.brand b{
font-size:17px
}

.brand span{
display:block;
color:var(--muted);
font-size:11px;
margin-top:4px
}

.step{
font-size:11px;
color:var(--muted)
}

.bar{
height:5px;
background:#18232f;
border-radius:8px;
overflow:hidden;
margin-bottom:22px
}

.bar i{
display:block;
height:100%;
background:var(--accent);
transition:.25s;
width:14%
}

.card{
background:rgba(17,25,35,.96);
border:1px solid var(--line);
border-radius:20px;
padding:26px;
box-shadow:0 18px 50px #0006
}

.eyebrow{
color:var(--accent);
font-size:12px;
margin-bottom:10px
}

.title{
font-size:24px;
font-weight:800;
line-height:1.6;
margin:0 0 8px
}

.desc{
color:#b4c0cd;
line-height:2;
font-size:13px;
margin:0 0 22px
}

.input{
width:100%;
background:#0c141d;
border:1px solid #334558;
color:#fff;
border-radius:12px;
padding:14px;
font-size:15px;
outline:none
}

.input:focus{
border-color:var(--accent)
}

.counter{
font-size:11px;
color:var(--muted);
margin-top:7px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:11px
}

.choice{
background:#0d151e;
border:1px solid #2a394a;
color:#dce6ee;
border-radius:13px;
padding:15px;
text-align:right;
cursor:pointer;
font-size:14px;
transition:.15s
}

.choice:hover,
.choice.selected{
border-color:var(--accent);
background:#11251f
}

.choice small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:5px
}

.actions{
display:flex;
gap:9px;
margin-top:22px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:12px;
padding:12px 18px;
cursor:pointer;
font-weight:700;
text-decoration:none;
display:inline-block
}

.primary{
background:var(--accent);
color:#07120f
}

.secondary{
background:#1a2735;
color:#d8e1e9;
border:1px solid #304254
}

.summary{
display:flex;
flex-wrap:wrap;
gap:7px;
margin:16px 0
}

.tag{
border:1px solid #2d4052;
background:#0d151e;
color:#b9c8d5;
border-radius:20px;
padding:7px 10px;
font-size:11px
}

.resultsHead{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px;
margin-bottom:15px
}

.resultsHead h2{
margin:0;
font-size:20px
}

.resultsHead p{
color:var(--muted);
font-size:11px;
margin:7px 0 0
}

.list{
display:grid;
gap:10px
}

.listing{
border:1px solid #29394a;
background:#0c141d;
border-radius:15px;
padding:16px;
cursor:pointer
}

.listing:hover{
border-color:#4c6977
}

.ltop{
display:flex;
justify-content:space-between;
gap:12px
}

.ltitle{
font-weight:800;
line-height:1.7;
font-size:14px
}

.price{
color:var(--accent);
font-weight:800;
white-space:nowrap;
font-size:13px
}

.meta{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:10px 0
}

.meta span{
font-size:10px;
color:#aebdca;
background:#16212d;
border-radius:8px;
padding:6px 8px
}

.excerpt{
color:#899aaa;
font-size:11px;
line-height:1.9
}

.source{
color:#62778b;
font-size:10px;
margin-top:9px
}

.detail .back{
margin-bottom:15px
}

.fulltext{
white-space:pre-line;
color:#b8c4cf;
font-size:12px;
line-height:2.15;
background:#0b131c;
border:1px solid #253546;
border-radius:13px;
padding:15px;
margin-top:15px
}

.detailGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:15px
}

.detailItem{
background:#101b26;
border-radius:10px;
padding:10px
}

.detailItem b{
display:block;
font-size:10px;
color:#74889b;
margin-bottom:5px
}

.detailItem span{
font-size:12px
}

.loading{
text-align:center;
padding:50px 10px
}

.spinner{
width:34px;
height:34px;
border:3px solid #294052;
border-top-color:var(--accent);
border-radius:50%;
animation:spin .8s linear infinite;
margin:0 auto 16px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.notice{
background:#15231f;
border:1px solid #2e5b50;
color:#a9d8cc;
padding:11px 13px;
border-radius:11px;
font-size:11px;
line-height:1.8;
margin-top:12px
}

@media(max-width:600px){

.app{
padding:18px 10px
}

.card{
padding:19px
}

.grid{
grid-template-columns:1fr
}

.title{
font-size:20px
}

.ltop{
display:block
}

.price{
display:block;
margin-top:7px
}

.detailGrid{
grid-template-columns:1fr
}

.resultsHead{
display:block
}

.resultsHead .btn{
margin-top:12px
}

}
</style>
</head>

<body>

<main class="app">

<div class="wrap">

<header class="head">

<div class="brand">

<div class="logo">E</div>

<div>
<b>Evren Nexus</b>
<span>دستیار مشاور املاک اورین نکسوس</span>
</div>

</div>

<div class="step" id="stepText">
مرحله ۱ از ۷
</div>

</header>

<div class="bar">
<i id="bar"></i>
</div>

<section id="root"></section>

</div>

</main>


<script>

const cities=[
'تهران',
'مشهد',
'تبریز',
'استانبول',
'ازمیر',
'آنتالیا'
];

const types=[
'مسکونی',
'تجاری',
'اداری',
'خدماتی',
'ورزشی',
'آموزشی',
'بهداشتی و درمانی',
'زمین',
'ویلا'
];

const rooms=[
'سوییت',
'تک خوابه',
'دو خوابه',
'سه خوابه و بیشتر'
];

const areas=[
'زیر ۶۰',
'۶۰–۷۰',
'۷۰–۸۰',
'۸۰–۹۰',
'۹۰–۱۲۰',
'۱۲۰–۱۵۰',
'بزرگتر از ۱۵۰'
];

const ages=[
'نوساز کلید نخورده',
'۱–۵ سال',
'۵–۱۰ سال',
'۱۰–۲۰ سال',
'بیشتر از ۲۰'
];


let s={
step:1,
username:'',
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];


function fa(n){

return String(n).replace(
/\d/g,
d=>'۰۱۲۳۴۵۶۷۸۹'[d]
);

}


function normalize(v){

return String(v ?? '')
.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
.replace(/ي/g,'ی')
.replace(/ك/g,'ک')
.trim()
.toLowerCase();

}


function number(v){

const n=normalize(v)
.replace(/,/g,'')
.replace(/[^0-9.]/g,'');

return n ? Number(n) : 0;

}


function render(){

document.getElementById('stepText').textContent=
s.step<=7
?`مرحله ${fa(s.step)} از ۷`
:'';

document.getElementById('bar').style.width=
(s.step<=7?s.step/7*100:100)+'%';

const r=document.getElementById('root');

if(s.step===1)
return intro(r);

if(s.step===2)
return choices(
r,
'نوع خدمت',
'برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:',
[
['خرید ملک','خرید'],
['اجاره ملک','اجاره']
],
'service'
);

if(s.step===3)
return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

if(s.step===4)
return choices(
r,
'شهر',
s.service==='خرید'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

if(s.step===5)
return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

if(s.step===6)
return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

if(s.step===7)
return choices(
r,
'سن بنا',
'سن بنای مورد نظر خود را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);

}


function intro(r){

r.innerHTML=`

<div class="card">

<div class="eyebrow">
EVREN NEXUS · AVRIN
</div>

<h1 class="title">
سلام، من دستیار مشاور املاک اورین نکسوس هستم.
</h1>

<p class="desc">

هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها،
به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.

<br>

این خدمات در حال حاضر رایگان ارائه می‌شود.

<br><br>

برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.
نام کاربری می‌تواند فارسی یا انگلیسی باشد و هیچ محدودیت تعداد کاراکتر ندارد.

</p>

<input
id="u"
class="input"
value="${escapeHtml(s.username)}"
placeholder="نام کاربری خود را وارد کنید"
>

<div id="count" class="counter">
${s.username.length} کاراکتر
</div>

<div class="actions">

<button
type="button"
class="btn primary"
id="startBtn"
>
شروع مشاوره
</button>

</div>

</div>

`;

const input=document.getElementById('u');

input.addEventListener(
'input',
function(){

s.username=this.value;

document.getElementById('count').textContent=
this.value.length+' کاراکتر';

}
);

document.getElementById('startBtn')
.addEventListener(
'click',
nextUser
);

}


function choices(r,ey,desc,items,key){

let html=`

<div class="card">

<div class="eyebrow">
${ey}
</div>

<h1 class="title">
${desc}
</h1>

<div class="grid">
`;

items.forEach(
(item,i)=>{

html+=`

<button
type="button"
class="choice ${s[key]===item[1]?'selected':''}"
data-choice="${i}"
>
${item[0]}
</button>

`;

}
);

html+=`

</div>

<div class="actions">

`;

if(s.step>1){

html+=`

<button
type="button"
class="btn secondary"
id="backBtn"
>
بازگشت
</button>

`;

}

if(editing){

html+=`

<button
type="button"
class="btn secondary"
id="resultsBtn"
>
بازگشت به نتایج
</button>

`;

}

html+=`

</div>

</div>
`;

r.innerHTML=html;


r.querySelectorAll('[data-choice]')
.forEach(btn=>{

btn.addEventListener(
'click',
function(){

const index=Number(
this.dataset.choice
);

pick(
key,
items[index][1]
);

}
);

});


const back=document.getElementById('backBtn');

if(back)
back.addEventListener(
'click',
prevStep
);


const resultsBtn=document.getElementById('resultsBtn');

if(resultsBtn)
resultsBtn.addEventListener(
'click',
showResults
);

}


function nextUser(){

if(!s.username.trim()){

alert('لطفاً یک نام کاربری وارد کنید.');

return;

}

s.username=s.username.trim();

s.step=2;

render();

}


function pick(k,v){

s[k]=v;

s.step++;

if(s.step===8){

searching();

}else{

render();

}

}


function prevStep(){

if(s.step>1 && s.step<=7){

s.step--;

render();

}

else if(s.step===8){

showResults();

}

}


function escapeHtml(value){

return String(value ?? '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


async function searching(){

document.getElementById('stepText')
.textContent='جست‌وجوی گزینه‌ها';

document.getElementById('bar')
.style.width='100%';

document.getElementById('root')
.innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال جست‌وجوی آگهی‌های واقعی ذخیره‌شده است.
</p>

</div>

`;

try{

const response=
await fetch(
'./data/listings.json?'+Date.now()
);

if(!response.ok)
throw new Error(
'HTTP '+response.status
);

const data=
await response.json();

results=
filterListings(
Array.isArray(data)?data:[]
);

showResults();

}

catch(e){

document.getElementById('root')
.innerHTML=`

<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
لطفاً دوباره تلاش کنید.
</p>

<div class="notice">
${escapeHtml(e.message)}
</div>

<div class="actions">

<button
type="button"
class="btn primary"
id="retryBtn"
>
تلاش دوباره
</button>

</div>

</div>

`;

document.getElementById('retryBtn')
.addEventListener(
'click',
searching
);

}

}


/* =========================
   FILTER ENGINE
========================= */

function filterListings(data){

const city=
normalize(s.city);

const wantedType=
normalize(s.type);

const wantedRoom=
normalize(s.room);


const areaRanges={

'زیر ۶۰':[0,59],

'۶۰–۷۰':[60,70],

'۷۰–۸۰':[70,80],

'۸۰–۹۰':[80,90],

'۹۰–۱۲۰':[90,120],

'۱۲۰–۱۵۰':[120,150],

'بزرگتر از ۱۵۰':[150,99999]

};


const ageRanges={

'نوساز کلید نخورده':[0,0],

'۱–۵ سال':[1,5],

'۵–۱۰ سال':[5,10],

'۱۰–۲۰ سال':[10,20],

'بیشتر از ۲۰':[20,9999]

};


const [amin,amax]=
areaRanges[s.area] || [0,99999];

const [ageMin,ageMax]=
ageRanges[s.age] || [0,99999];


const roomWanted=
s.room==='سوییت'
?0
:s.room==='تک خوابه'
?1
:s.room==='دو خوابه'
?2
:3;


const typeWords={

'مسکونی':[
'مسکونی',
'آپارتمان',
'خانه',
'منزل',
'پنت هاوس',
'واحد مسکونی'
],

'تجاری':[
'تجاری',
'مغازه',
'فروشگاه',
'سرقفلی',
'واحد تجاری'
],

'اداری':[
'اداری',
'دفتر',
'دفترکار',
'واحد اداری'
],

'خدماتی':[
'خدماتی'
],

'ورزشی':[
'ورزشی',
'باشگاه'
],

'آموزشی':[
'آموزشی',
'مدرسه',
'آموزشگاه'
],

'بهداشتی و درمانی':[
'پزشکی',
'درمانی',
'مطب',
'کلینیک',
'بیمارستان'
],

'زمین':[
'زمین',
'قطعه زمین',
'زمین مسکونی',
'زمین تجاری'
],

'ویلا':[
'ویلا',
'باغ ویلا',
'باغ‌ویلا'
]

};


function extractArea(x,text){

const raw=
x.area ??
x.meterage ??
x.size ??
x.area_m2 ??
x.meter ??
x.metraj ??
x['متراژ'] ??
'';

let n=number(raw);

if(n>0)
return n;


const patterns=[

/(\d{2,5})\s*(?:متر|متری|مترمربع|متر مربع)/i,

/متراژ\s*[:：]?\s*(\d{2,5})/i,

/(\d{2,5})\s*متر/i

];

for(const p of patterns){

const m=text.match(p);

if(m){

const v=Number(m[1]);

if(v>0)
return v;

}

}

return 0;

}


function extractRooms(x,text){

const raw=
x.rooms ??
x.room ??
x.bedrooms ??
x.bedroom ??
x['اتاق'] ??
x['اتاق خواب'] ??
'';

let n=number(raw);

if(n>0)
return n;


if(
/سه\s*(خوابه|اتاق)/.test(text) ||
/3\s*(خوابه|اتاق)/.test(text)
)
return 3;

if(
/دو\s*(خوابه|اتاق)/.test(text) ||
/2\s*(خوابه|اتاق)/.test(text)
)
return 2;

if(
/تک\s*(خوابه|اتاق)/.test(text) ||
/یک\s*(خوابه|اتاق)/.test(text) ||
/1\s*(خوابه|اتاق)/.test(text)
)
return 1;

if(
/سوییت|سوئیت|استودیو/.test(text)
)
return 0;

return 0;

}


function extractAge(x,text){

const raw=
x.age ??
x.buildingAge ??
x.building_age ??
x['سن بنا'] ??
x['عمر بنا'] ??
'';

let n=number(raw);

if(n>=0 && raw!=='')
return n;


let m=
text.match(
/(?:سن بنا|عمر بنا|ساخت)\s*[:：]?\s*(\d{1,3})/
);

if(m)
return Number(m[1]);


m=text.match(
/(\d{1,3})\s*سال(?:ه)?\s*(?:ساخت|بنا|سن)/
);

if(m)
return Number(m[1]);


if(
/نوساز|کلید نخورده/.test(text)
)
return 0;


return 0;

}


return data
.map((x,i)=>{

const title=
x.title ||
x.name ||
x.heading ||
x.subject ||
x.headline ||
'آگهی ملک';


const text=
x.description ||
x.text ||
x.body ||
x.content ||
x.desc ||
x.details ||
'';


const rawCity=
x.city ||
x.cityName ||
x.location?.city ||
x['شهر'] ||
'';


const rawType=
x.type ||
x.propertyType ||
x.categoryName ||
x.category ||
x['نوع ملک'] ||
'';


const rawRoom=
x.rooms ||
x.room ||
x.bedrooms ||
x.bedroom ||
x['اتاق'] ||
x['اتاق خواب'] ||
'';


const all=
normalize(
title+' '+
text+' '+
rawCity+' '+
rawType+' '+
String(x.category||'')
);


const areaNum=
extractArea(
x,
normalize(title+' '+text)
);


const ageNum=
extractAge(
x,
normalize(title+' '+text)
);


const roomNum=
extractRooms(
x,
normalize(title+' '+text)
);


const cityText=
normalize(
rawCity+' '+all
);


const cityOk=
!city ||
cityText.includes(city);


const typeOk=
!wantedType ||
normalize(rawType).includes(wantedType) ||
wantedType.includes(normalize(rawType)) ||
(typeWords[s.type]||[])
.some(
k=>all.includes(normalize(k))
);


let roomOk=true;


/*
اگر اطلاعات تعداد اتاق در داده وجود داشته باشد،
فیلتر اعمال می‌شود.
اگر اطلاعات موجود نباشد، آگهی حذف نمی‌شود.
*/

if(roomNum>0){

if(roomWanted===0){

roomOk=
/سوییت|سوئیت|استودیو/.test(all);

}else if(roomWanted===3){

roomOk=
roomNum>=3;

}else{

roomOk=
roomNum===roomWanted;

}

}


let areaOk=true;


/*
اگر متراژ پیدا شده باشد،
فیلتر متراژ اعمال می‌شود.
اگر متراژ ناشناخته باشد،
آگهی حذف نمی‌شود.
*/

if(areaNum>0){

areaOk=
areaNum>=amin &&
areaNum<=amax;

}


let ageOk=true;


/*
اگر سن بنا پیدا شده باشد،
فیلتر سن اعمال می‌شود.
اگر سن بنا ناشناخته باشد،
آگهی حذف نمی‌شود.
*/

if(ageNum>0 || s.age==='نوساز کلید نخورده'){

ageOk=
ageNum>=ageMin &&
ageNum<=ageMax;

}


const link=
x.url ||
x.link ||
x.webUrl ||
x.shareUrl ||
x.share_url ||
x.canonicalUrl ||
x.adUrl ||
'#';


const price=
x.price ||
x.priceText ||
x.total_price ||
x.totalPrice ||
x['قیمت'] ||
x['قیمت کل'] ||
'قیمت توافقی';


return{

...x,

id:
x.id ||
x.token ||
x.key ||
x.adId ||
i+1,

title:title,

text:text,

city:rawCity,

type:rawType,

rooms:
rawRoom ||
(roomNum?String(roomNum):''),

area:
areaNum
?fa(areaNum)+' متر'
:'نامشخص',

areaNum:

areaNum,

age:

ageNum
?fa(ageNum)+' سال'
:'نامشخص',

ageNum:

ageNum,

price:

price,

link:

link,

_match:{
cityOk,
typeOk,
roomOk,
areaOk,
ageOk
}

};

})

.filter(x=>

x._match.cityOk &&
x._match.typeOk &&
x._match.roomOk &&
x._match.areaOk &&
x._match.ageOk

)

.slice(0,14);

}

id="cname"

>

<div style="height:10px"></div>

<input
id="cphone"
class="input"

>

>

<div class="actions">

>

</button>

<button
type="button"

id="contactBack"
>
بازگشت به نتایج
</button>

</div>

`;

}


function finishContact(){

const name=
document.getElementById('cname')
.value.trim();

const phone=
document.getElementById('cphone')
.value.trim();

const email=
document.getElementById('cemail')
.value.trim();


if(!name){

alert(
'لطفاً نام خود را وارد کنید.'
);

return;

}


if(!phone&&!email){

alert(
'لطفاً حداقل شماره تلفن یا ایمیل را وارد کنید.'
);

return;

}


s.contactName=name;
s.contactPhone=phone;
s.contactEmail=email;


const lead={

username:s.username,

service:s.service,

type:s.type,

city:s.city,

room:s.room,

area:s.area,

age:s.age,

name:name,

phone:phone,

email:email,

shownListings:
results.map(
x=>({

id:x.id,

title:x.title,

price:x.price,

link:x.link

})
),

createdAt:
new Date().toISOString()

};


const leads=
JSON.parse(
localStorage.getItem('avrin_leads')||'[]'
);


leads.push(lead);


localStorage.setItem(
'avrin_leads',
JSON.stringify(leads)
);


showResults();

}


function showContact(){

document.getElementById('stepText')
.textContent='اطلاعات تماس';

document.getElementById('bar')
.style.width='100%';

document.getElementById('root')
.innerHTML=contactForm();


document.getElementById('finishBtn')
.addEventListener(
'click',
finishContact
);


document.getElementById('contactBack')
.addEventListener(
'click',
showResults
);

}


render();
