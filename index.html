<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشاور ملک اورین</title>

<style>
:root{--bg:#0b1017;--panel:#111923;--panel2:#172331;--line:#263547;--text:#edf3f8;--muted:#91a2b5;--accent:#46c6a7;--accent2:#2aa88c;--danger:#e47a7a}
*{box-sizing:border-box}
body{margin:0;background:#070b10;color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
.app{min-height:100vh;background:linear-gradient(145deg,#0b1017,#0d141d 55%,#101a23);padding:28px 16px}
.wrap{max-width:850px;margin:auto}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border:1px solid #3b5a67;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-weight:800}
.brand b{font-size:17px}
.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.step{font-size:11px;color:var(--muted)}
.bar{height:5px;background:#18232f;border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:.25s;width:14%}
.card{background:rgba(17,25,35,.96);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 50px #0006}
.eyebrow{color:var(--accent);font-size:12px;margin-bottom:10px}
.title{font-size:24px;font-weight:800;line-height:1.6;margin:0 0 8px}
.desc{color:#b4c0cd;line-height:2;font-size:13px;margin:0 0 22px}
.input{width:100%;background:#0c141d;border:1px solid #334558;color:#fff;border-radius:12px;padding:14px;font-size:15px;outline:none}
.input:focus{border-color:var(--accent)}
.counter{font-size:11px;color:var(--muted);margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.choice{background:#0d151e;border:1px solid #2a394a;color:#dce6ee;border-radius:13px;padding:15px;text-align:right;cursor:pointer;font-size:14px;transition:.15s}
.choice:hover,.choice.selected{border-color:var(--accent);background:#11251f}
.choice small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.actions{display:flex;gap:9px;margin-top:22px}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#07120f}
.secondary{background:#1a2735;color:#d8e1e9;border:1px solid #304254}
.summary{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
.tag{border:1px solid #2d4052;background:#0d151e;color:#b9c8d5;border-radius:20px;padding:7px 10px;font-size:11px}
.resultsHead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:15px}
.resultsHead h2{margin:0;font-size:20px}
.resultsHead p{color:var(--muted);font-size:11px;margin:7px 0 0}
.list{display:grid;gap:10px}
.listing{border:1px solid #29394a;background:#0c141d;border-radius:15px;padding:16px;cursor:pointer}
.listing:hover{border-color:#4c6977}
.ltop{display:flex;justify-content:space-between;gap:12px}
.ltitle{font-weight:800;line-height:1.7;font-size:14px}
.price{color:var(--accent);font-weight:800;white-space:nowrap;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.meta span{font-size:10px;color:#aebdca;background:#16212d;border-radius:8px;padding:6px 8px}
.excerpt{color:#899aaa;font-size:11px;line-height:1.9}
.source{color:#62778b;font-size:10px;margin-top:9px}
.detail .back{margin-bottom:15px}
.fulltext{white-space:pre-line;color:#b8c4cf;font-size:12px;line-height:2.15;background:#0b131c;border:1px solid #253546;border-radius:13px;padding:15px;margin-top:15px}
.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.detailItem{background:#101b26;border-radius:10px;padding:10px}
.detailItem b{display:block;font-size:10px;color:#74889b;margin-bottom:5px}
.detailItem span{font-size:12px}
.loading{text-align:center;padding:50px 10px}
.spinner{width:34px;height:34px;border:3px solid #294052;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:#15231f;border:1px solid #2e5b50;color:#a9d8cc;padding:11px 13px;border-radius:11px;font-size:11px;line-height:1.8;margin-top:12px}

@media(max-width:600px){
.app{padding:18px 10px}
.card{padding:19px}
.grid{grid-template-columns:1fr}
.title{font-size:20px}
.ltop{display:block}
.price{display:block;margin-top:7px}
.detailGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<main class="app">
<div class="wrap">

<header class="head">
<div class="brand">
<div class="logo">E</div>
<div>
<b>Evren Nexus</b>
<span>مشاور ملک اورین</span>
</div>
</div>

<div class="step" id="stepText">مرحله ۱ از ۷</div>
</header>

<div class="bar">
<i id="bar"></i>
</div>

<section id="root"></section>

</div>
</main>

<script>

const cities=[
'تهران',
'مشهد',
'تبریز',
'استانبول',
'ازمیر',
'آنتالیا'
];

const types=[
'مسکونی',
'تجاری',
'اداری',
'خدماتی',
'ورزشی',
'آموزشی',
'بهداشتی و درمانی',
'زمین',
'ویلا'
];

const rooms=[
'سوییت',
'تک خوابه',
'دو خوابه',
'سه خوابه و بیشتر'
];

const areas=[
'زیر ۶۰',
'۶۰–۷۰',
'۷۰–۸۰',
'۸۰–۹۰',
'۹۰–۱۲۰',
'۱۲۰–۱۵۰',
'بزرگتر از ۱۵۰'
];

const ages=[
'نوساز کلید نخورده',
'۱–۵ سال',
'۵–۱۰ سال',
'۱۰–۲۰ سال',
'بیشتر از ۲۰'
];

let s={
step:1,
username:'',
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function render(){

document.getElementById('stepText').textContent=
s.step<=7?`مرحله ${fa(s.step)} از ۷`:'';

document.getElementById('bar').style.width=
(s.step<=7?s.step/7*100:100)+'%';

let r=document.getElementById('root');

if(s.step===1)return intro(r);

if(s.step===2)
return choices(
r,
'نوع خدمت',
'برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:',
[
['خرید ملک','خرید'],
['اجاره ملک','اجاره']
],
'service'
);

if(s.step===3)
return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

if(s.step===4)
return choices(
r,
'شهر',
s.service==='خرید'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

if(s.step===5)
return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

if(s.step===6)
return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

if(s.step===7)
return choices(
r,
'سن بنا',
'سن بنای مورد نظر خود را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);

}

function intro(r){

r.innerHTML=`

<div class="card">

<div class="eyebrow">
EVREN NEXUS · AV RIN
</div>

<h1 class="title">
سلام، من مشاور ملک اورین هستم.
</h1>

<p class="desc">
هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها،
به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.
<br>
این خدمات در حال حاضر رایگان ارائه می‌شود.
<br><br>
برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.
نام کاربری می‌تواند فارسی یا انگلیسی باشد و هیچ محدودیت تعداد کاراکتر ندارد.
</p>

<input
id="u"
class="input"
value="${s.username}"
placeholder="نام کاربری خود را وارد کنید"
oninput="s.username=this.value;document.getElementById('count').textContent=this.value.length+' کاراکتر'"
>

<div id="count" class="counter">
${s.username.length} کاراکتر
</div>

<div class="actions">

<button
class="btn primary"
onclick="nextUser()"
>
شروع مشاوره
</button>

</div>

</div>

`;

}

function choices(r,ey,desc,items,key){

let back=s.step>1
?`<button class="btn secondary" onclick="prevStep()">بازگشت</button>`
:'';

r.innerHTML=`

<div class="card">

<div class="eyebrow">
${ey}
</div>

<h1 class="title">
${desc}
</h1>

<div class="grid">

${items.map(([label,val])=>`

<button
class="choice ${s[key]===val?'selected':''}"
onclick="pick('${key}',${JSON.stringify(val)})"
>
${label}
</button>

`).join('')}

</div>

<div class="actions">

${back}

${editing
?'<button class="btn secondary" onclick="showResults()">بازگشت به نتایج</button>'
:''}

</div>

</div>

`;

}

function nextUser(){

if(!s.username.trim())
return alert('لطفاً یک نام کاربری وارد کنید.');

s.username=s.username.trim();

s.step=2;

render();

}

function pick(k,v){

s[k]=v;

s.step++;

if(s.step===8)
searching();
else
render();

}

function prevStep(){

if(s.step>1&&s.step<=7){

s.step--;

render();

}
else if(s.step===8){

showResults();

}

}

async function searching(){

document.getElementById('stepText').textContent=
'جست‌وجوی گزینه‌ها';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال جست‌وجوی آگهی‌های واقعی ذخیره‌شده است.
</p>

</div>

`;

try{

const response=await fetch(
'./data/listings.json?'+Date.now()
);

if(!response.ok)
throw new Error('HTTP '+response.status);

const data=await response.json();

results=filterListings(
Array.isArray(data)?data:[]
);

showResults();

}

catch(e){

document.getElementById('root').innerHTML=`

<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
لطفاً دوباره تلاش کنید.
</p>

<div class="notice">
${e.message}
</div>

<div class="actions">

<button
class="btn primary"
onclick="searching()"
>
تلاش دوباره
</button>

</div>

</div>

`;

}

}

function filterListings(data){

const normalize=v=>
String(v??'').trim().toLowerCase();

const city=normalize(s.city);
const room=normalize(s.room);
const type=normalize(s.type);

const ageRanges={

'نوساز کلید نخورده':[0,0],

'۱–۵ سال':[1,5],

'۵–۱۰ سال':[5,10],

'۱۰–۲۰ سال':[10,20],

'بیشتر از ۲۰':[20,9999]

};

const areaRanges={

'زیر ۶۰':[0,59],

'۶۰–۷۰':[60,70],

'۷۰–۸۰':[70,80],

'۸۰–۹۰':[80,90],

'۹۰–۱۲۰':[90,120],

'۱۲۰–۱۵۰':[120,150],

'بزرگتر از ۱۵۰':[150,99999]

};

const [amin,amax]=
areaRanges[s.area]||[0,99999];

const [ageMin,ageMax]=
ageRanges[s.age]||[0,99999];

return data

.map((x,i)=>{

const title=
x.title||
x.name||
x.heading||
'آگهی ملک';

const text=
x.description||
x.text||
x.body||
x.content||
'';

const rawArea=
x.area||
x.meterage||
x.size||
x.area_m2||
x['متراژ']||
0;

const areaNum=
Number(
String(rawArea).replace(/[^0-9.]/g,'')
)||0;

const rawAge=
x.age||
x.buildingAge||
x['سن بنا']||
0;

const ageNum=
Number(
String(rawAge).replace(/[^0-9.]/g,'')
)||0;

const rawCity=
x.city||
x.cityName||
x['شهر']||
'';

const rawType=
x.type||
x.category||
x.categoryName||
x['نوع ملک']||
'';

const rawRoom=
x.rooms||
x.room||
x.bedrooms||
x['اتاق']||
'';

const link=
x.url||
x.link||
x.webUrl||
x.shareUrl||
'#';

const price=
x.price||
x.priceText||
x['قیمت']||
'قیمت توافقی';

return{

...x,

id:x.id||x.token||i+1,

title,

text,

area:
areaNum
?fa(areaNum)+' متر'
:'',

areaNum,

age:
ageNum
?fa(ageNum)+' سال'
:'نامشخص',

ageNum,

city:rawCity,

type:rawType,

rooms:rawRoom,

price,

link

};

})

.filter(x=>
!city||
normalize(x.city).includes(city)||
normalize(city).includes(normalize(x.city))
)

.filter(x=>
!type||
normalize(x.type).includes(type)||
normalize(type).includes(normalize(x.type))
)

.filter(x=>
!room||
normalize(x.rooms).includes(room)||
normalize(room).includes(normalize(x.rooms))
)

.filter(x=>
x.areaNum>=amin&&
x.areaNum<=amax
)

.filter(x=>
x.ageNum>=ageMin&&
x.ageNum<=ageMax
)

.slice(0,14);

}

function tags(){

return `

<div class="summary">

<span class="tag">
${s.service}
</span>

<span class="tag">
${s.type}
</span>

<span class="tag">
${s.city}
</span>

<span class="tag">
${s.room}
</span>

<span class="tag">
${s.area}
</span>

<span class="tag">
${s.age}
</span>

</div>

`;

}

function showResults(){

s.step=8;

document.getElementById('stepText').textContent=
'نتایج جست‌وجو';

document.getElementById('root').innerHTML=`

<div class="card">

<div class="resultsHead">

<div>

<div class="eyebrow">
AVRIN MATCH
</div>

<h2>
${fa(results.length)} گزینه منطبق پیدا شد
</h2>

<p>
این گزینه‌ها از آرشیو واقعی آگهی‌های دریافت‌شده برای اورین انتخاب شده‌اند.
</p>

</div>

<button
class="btn secondary"
onclick="editSearch()"
>
ویرایش اطلاعات جستجو
</button>

</div>

${tags()}

<div class="list">

${
results.length

?

results.map(x=>`

<article
class="listing"
onclick="detail(${JSON.stringify(x.id)})"
>

<div class="ltop">

<div class="ltitle">
${x.title}
</div>

<div class="price">
${x.price}
</div>

</div>

<div class="meta">

<span>
${x.area||'متراژ نامشخص'}
</span>

<span>
${x.rooms||'اتاق نامشخص'}
</span>

<span>
${x.age||'سن نامشخص'}
</span>

<span>
${x.city||s.city}
</span>

</div>

<div class="excerpt">
${String(x.text||'').split('\n')[0]}
</div>

<div class="source">
منبع: آرشیو آگهی‌های اورین
</div>

</article>

`).join('')

:

`

<div class="notice">

در آرشیو فعلی، آگهی‌ای با تمام معیارهای انتخاب‌شده پیدا نشد.

</div>

`

}

</div>

<div class="actions">

<button
class="btn primary"
onclick="showContact()"
>
ارائه اطلاعات برای مشاوره دقیق‌تر
</button>

</div>

</div>

`;

}

function detail(id){

let x=results.find(
a=>String(a.id)===String(id)
);

if(!x)return;

document.getElementById('stepText').textContent=
'جزئیات آگهی';

document.getElementById('root').innerHTML=`

<div class="card detail">

<button
class="btn secondary back"
onclick="showResults()"
>
← بازگشت به نتایج
</button>

<div class="eyebrow">
جزئیات گزینه
</div>

<h1 class="title">
${x.title}
</h1>

<div
class="price"
style="font-size:18px"
>
${x.price}
</div>

<div class="detailGrid">

${[
['شهر',x.city||s.city],
['محله',x.neighborhood||x.district||'نامشخص'],
['متراژ',x.area||'نامشخص'],
['اتاق',x.rooms||'نامشخص'],
['سن بنا',x.age||'نامشخص'],
['وضعیت','آگهی واقعی']
].map(a=>`

<div class="detailItem">

<b>
${a[0]}
</b>

<span>
${a[1]}
</span>

</div>

`).join('')}

</div>

<div class="fulltext">

${x.text||'توضیحات آگهی در داده دریافت‌شده موجود نیست.'}

</div>

<div class="actions">

<a
class="btn secondary"
href="${x.link}"
target="_blank"
rel="noopener"
>
مشاهده آگهی اصلی
</a>

<button
class="btn secondary"
onclick="editSearch()"
>
ویرایش اطلاعات جستجو
</button>

</div>

</div>

`;

}

function editSearch(){

editing=true;

s.step=2;

render();

}

function contactForm(){

return `

<div class="card">

<div class="eyebrow">
اطلاعات تماس
</div>

<h1 class="title">
اطلاعات تماس برای ادامه
</h1>

<p class="desc">
لطفاً نام خود را وارد کنید و حداقل یکی از شماره تلفن یا ایمیل را ثبت نمایید.
</p>

<input
id="cname"
class="input"
placeholder="نام و نام خانوادگی"
>

<div style="height:10px"></div>

<input
id="cphone"
class="input"
type="tel"
inputmode="tel"
placeholder="شماره تلفن (اختیاری)"
>

<div style="height:10px"></div>

<input
id="cemail"
class="input"
type="email"
placeholder="ایمیل (اختیاری)"
>

<div class="actions">

<button
class="btn primary"
onclick="finishContact()"
>
ثبت اطلاعات
</button>

<button
class="btn secondary"
onclick="showResults()"
>
بازگشت به نتایج
</button>

</div>

</div>

`;

}

function finishContact(){

const name=
document.getElementById('cname').value.trim();

const phone=
document.getElementById('cphone').value.trim();

const email=
document.getElementById('cemail').value.trim();

if(!name)
return alert('لطفاً نام خود را وارد کنید.');

if(!phone&&!email)
return alert(
'لطفاً حداقل شماره تلفن یا ایمیل را وارد کنید.'
);

const lead={

username:s.username,

service:s.service,

type:s.type,

city:s.city,

room:s.room,

area:s.area,

age:s.age,

name,

phone,

email,

shownListings:

results.map(x=>({

id:x.id,

title:x.title,

price:x.price,

link:x.link

})),

createdAt:new Date().toISOString()

};

const leads=
JSON.parse(
localStorage.getItem('avrin_leads')||'[]'
);

leads.push(lead);

localStorage.setItem(
'avrin_leads',
