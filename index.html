<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار مشاور املاک اورین نکسوس</title>
<style>
:root{--bg:#070b10;--panel:#111923;--panel2:#172331;--line:#263547;--text:#edf3f8;--muted:#91a2b5;--accent:#46c6a7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
.app{min-height:100vh;background:linear-gradient(145deg,#0b1017,#0d141d 55%,#101a23);padding:22px 12px}
.wrap{max-width:850px;margin:auto}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border:1px solid #3b5a67;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-weight:800}
.brand b{font-size:17px}
.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.step{font-size:11px;color:var(--muted)}
.bar{height:5px;background:#18232f;border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:.25s;width:14%}
.card{background:rgba(17,25,35,.97);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 50px #0006}
.eyebrow{color:var(--accent);font-size:12px;margin-bottom:10px}
.title{font-size:24px;font-weight:800;line-height:1.6;margin:0 0 8px}
.desc{color:#b4c0cd;line-height:2;font-size:13px;margin:0 0 22px}
.input{width:100%;background:#0c141d;border:1px solid #334558;color:#fff;border-radius:12px;padding:14px;font-size:15px;outline:none}
.input:focus{border-color:var(--accent)}
.counter{font-size:11px;color:var(--muted);margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.choice{background:#0d151e;border:1px solid #2a394a;color:#dce6ee;border-radius:13px;padding:15px;text-align:right;cursor:pointer;font-size:14px}
.choice:hover,.choice.selected{border-color:var(--accent);background:#11251f}
.actions{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.primary{background:var(--accent);color:#07120f}
.secondary{background:#1a2735;color:#d8e1e9;border:1px solid #304254}
.summary{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
.tag{border:1px solid #2d4052;background:#0d151e;color:#b9c8d5;border-radius:20px;padding:7px 10px;font-size:11px}
.resultsHead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:15px}
.resultsHead h2{margin:0;font-size:20px}
.resultsHead p{color:var(--muted);font-size:11px;margin:7px 0 0}
.list{display:grid;gap:10px}
.listing{border:1px solid #29394a;background:#0c141d;border-radius:15px;padding:16px;cursor:pointer}
.listing:hover{border-color:#4c6977}
.listingImage{width:100%;height:190px;object-fit:cover;border-radius:11px;margin-bottom:12px;background:#172331}
.ltop{display:flex;justify-content:space-between;gap:12px}
.ltitle{font-weight:800;line-height:1.7;font-size:14px}
.price{color:var(--accent);font-weight:800;white-space:nowrap;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.meta span{font-size:10px;color:#aebdca;background:#16212d;border-radius:8px;padding:6px 8px}
.excerpt{color:#899aaa;font-size:11px;line-height:1.9}
.source{color:#62778b;font-size:10px;margin-top:9px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.gallery img{width:100%;height:160px;object-fit:cover;border-radius:10px;background:#172331}
.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.detailItem{background:#101b26;border-radius:10px;padding:11px}
.detailItem b{display:block;font-size:10px;color:#74889b;margin-bottom:5px}
.detailItem span{font-size:12px}
.fulltext{white-space:pre-line;color:#b8c4cf;font-size:12px;line-height:2.15;background:#0b131c;border:1px solid #253546;border-radius:13px;padding:15px;margin-top:15px}
.loading{text-align:center;padding:50px 10px}
.spinner{width:34px;height:34px;border:3px solid #294052;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:#15231f;border:1px solid #2e5b50;color:#a9d8cc;padding:11px 13px;border-radius:11px;font-size:11px;line-height:1.8;margin-top:12px}
.siteFooter{text-align:center;color:#65788b;font-size:10px;padding:25px 0 8px}
@media(max-width:600px){
.app{padding:18px 10px}
.card{padding:19px}
.grid{grid-template-columns:1fr}
.title{font-size:20px}
.ltop{display:block}
.price{display:block;margin-top:7px}
.detailGrid{grid-template-columns:1fr}
.gallery{grid-template-columns:repeat(2,1fr)}
.gallery img{height:130px}
}
</style>
</head>

<body>

<main class="app">
<div class="wrap">

<header class="head">
<div class="brand">
<div class="logo">E</div>
<div>
<b>Evren Nexus</b>
<span>دستیار مشاور املاک اورین نکسوس</span>
</div>
</div>
<div class="step" id="stepText">مرحله ۱ از ۷</div>
</header>

<div class="bar"><i id="bar"></i></div>

<section id="root"></section>

<footer class="siteFooter">
Evren Nexus · Avrin Property Advisor
</footer>

</div>
</main>

<script>

const cities=['تهران','مشهد','تبریز','استانبول','ازمیر','آنتالیا'];

const types=[
'مسکونی','تجاری','اداری','خدماتی','ورزشی',
'آموزشی','بهداشتی و درمانی','زمین','ویلا'
];

const rooms=[
'سوییت','تک خوابه','دو خوابه','سه خوابه و بیشتر'
];

const areas=[
'زیر ۶۰','۶۰–۷۰','۷۰–۸۰','۸۰–۹۰',
'۹۰–۱۲۰','۱۲۰–۱۵۰','بزرگتر از ۱۵۰'
];

const ages=[
'نوساز کلید نخورده','۱–۵ سال','۵–۱۰ سال',
'۱۰–۲۰ سال','بیشتر از ۲۰'
];

let s={
step:1,
username:'',
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];

const fa=n=>
String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function esc(v){
return String(v??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

function normalize(v){
return String(v??'').trim().toLowerCase();
}

function render(){

document.getElementById('stepText').textContent=
s.step<=7?`مرحله ${fa(s.step)} از ۷`:'';

document.getElementById('bar').style.width=
(s.step<=7?s.step/7*100:100)+'%';

const r=document.getElementById('root');

if(s.step===1)return intro(r);

if(s.step===2)
return choices(
r,
'نوع خدمت',
'برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:',
[['خرید ملک','sale'],['اجاره ملک','rent']],
'service'
);

if(s.step===3)
return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

if(s.step===4)
return choices(
r,
'شهر',
s.service==='sale'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

if(s.step===5)
return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

if(s.step===6)
return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

if(s.step===7)
return choices(
r,
'سن بنا',
'سن بنای مورد نظر خود را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);

}

function intro(r){

r.innerHTML=`

<div class="card">

<div class="eyebrow">EVREN NEXUS · AVRiN</div>

<h1 class="title">
سلام، من دستیار مشاور املاک اورین نکسوس هستم.
</h1>

<p class="desc">
هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها،
به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.
<br>
این خدمات در حال حاضر رایگان ارائه می‌شود.
<br><br>
برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.
</p>

<input
id="u"
class="input"
placeholder="نام کاربری خود را وارد کنید"
value="${esc(s.username)}">

<div id="count" class="counter">
${s.username.length} کاراکتر
</div>

<div class="actions">
<button class="btn primary" id="startBtn">
شروع مشاوره
</button>
</div>

</div>
`;

const u=document.getElementById('u');

u.addEventListener('input',()=>{
s.username=u.value;
document.getElementById('count').textContent=
u.value.length+' کاراکتر';
});

document.getElementById('startBtn')
.addEventListener('click',nextUser);

}

function choices(r,ey,desc,items,key){

let back=
s.step>1
?'<button class="btn secondary" id="backBtn">بازگشت</button>'
:'';

r.innerHTML=`

<div class="card">

<div class="eyebrow">${ey}</div>

<h1 class="title">${desc}</h1>

<div class="grid">

${items.map(([label,val])=>`

<button
class="choice ${s[key]===val?'selected':''}"
data-key="${esc(key)}"
data-value="${esc(val)}">

${label}

</button>

`).join('')}

</div>

<div class="actions">

${back}

${editing?
'<button class="btn secondary" id="resultsBtn">بازگشت به نتایج</button>'
:''}

</div>

</div>
`;

r.querySelectorAll('.choice').forEach(btn=>{

btn.addEventListener('click',()=>{
pick(btn.dataset.key,btn.dataset.value);
});

});

if(document.getElementById('backBtn'))
document.getElementById('backBtn')
.addEventListener('click',prevStep);

if(document.getElementById('resultsBtn'))
document.getElementById('resultsBtn')
.addEventListener('click',showResults);

}

function nextUser(){

if(!s.username.trim()){
alert('لطفاً یک نام کاربری وارد کنید.');
return;
}

s.username=s.username.trim();
s.step=2;
render();

}

function pick(k,v){

s[k]=v;

s.step++;

if(s.step===8)
searching();
else
render();

}

function prevStep(){

if(s.step>1&&s.step<=7){
s.step--;
render();
}

}

async function searching(){

document.getElementById('stepText').textContent=
'جست‌وجوی گزینه‌ها';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال جست‌وجوی آگهی‌های واقعی ذخیره‌شده است.
</p>

</div>
`;

try{

const url=
new URL(
'data/listings.json',
window.location.href
).href;

const response=
await fetch(url+'?v='+Date.now(),{
cache:'no-store'
});

if(!response.ok)
throw new Error('HTTP '+response.status);

const data=await response.json();

if(!Array.isArray(data))
throw new Error('Invalid JSON');

results=filterListings(data);

showResults();

}catch(e){

document.getElementById('root').innerHTML=`

<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
</p>

<div class="notice">
${esc(e.message)}
</div>

<div class="actions">

<button
class="btn primary"
id="retryBtn">
تلاش دوباره
</button>

</div>

</div>
`;

document.getElementById('retryBtn')
.addEventListener('click',searching);

}

}

function filterListings(data){

const areaRanges={
'زیر ۶۰':[0,59],
'۶۰–۷۰':[60,70],
'۷۰–۸۰':[70,80],
'۸۰–۹۰':[80,90],
'۹۰–۱۲۰':[90,120],
'۱۲۰–۱۵۰':[120,150],
'بزرگتر از ۱۵۰':[150,999999]
};

const ageRanges={
'نوساز کلید نخورده':[0,0],
'۱–۵ سال':[1,5],
'۵–۱۰ سال':[5,10],
'۱۰–۲۰ سال':[10,20],
'بیشتر از ۲۰':[20,9999]
};

const [amin,amax]=
areaRanges[s.area]||[0,999999];

const [ageMin,ageMax]=
ageRanges[s.age]||[0,9999];

return data

.map((x,i)=>{

const title=
x.title||'آگهی ملک';

const text=
x.description||
x.text||
x.body||
x.content||
x.subtitle||
'';

const rawArea=
x.area||
x.meterage||
x.size||
x.area_m2||
0;

const areaNum=
Number(
String(rawArea)
.replace(/[^0-9.]/g,'')
)||0;

const rawAge=
x.age||
x.buildingAge||
0;

const ageNum=
Number(
String(rawAge)
.replace(/[^0-9.]/g,'')
)||0;

const rawRoom=
x.rooms||
x.room||
x.bedrooms||
'';

const rawType=
x.type||
x.propertyType||
'';

const images=
Array.isArray(x.images)
?x.images
:(x.thumbnailUrl?[x.thumbnailUrl]:[]);

return{

...x,

id:x.id||x.token||i,

title,

text,

areaNum,

area:areaNum
?fa(areaNum)+' متر'
:'',

ageNum,

age:ageNum
?fa(ageNum)+' سال'
:'نامشخص',

city:x.city||'',

district:x.district||'',

rooms:rawRoom,

type:rawType,

price:
x.priceText||
x.price||
'قیمت توافقی',

link:x.url||'#',

images

};

})

.filter(x=>{

const cityMatch=
!s.city||
normalize(x.city).includes(normalize(s.city))||
normalize(s.city).includes(normalize(x.city));

const dealMatch=
x.dealType===s.service;

const typeMatch=
!s.type||
normalize(x.type).includes(normalize(s.type))||
(
s.type==='مسکونی' &&
/آپارتمان|خانه|مسکونی|ویلا/i
.test(
x.title+' '+x.text+' '+x.tags
)
);

const roomText=
normalize(
x.rooms+' '+x.title+' '+x.text
);

let roomMatch=true;

if(s.room==='سوییت')
roomMatch=/سوئیت|سوییت|استودیو/i.test(roomText);

if(s.room==='تک خوابه')
roomMatch=/۱\s*خواب|1\s*خواب|تک.?خواب/i.test(roomText);

if(s.room==='دو خوابه')
roomMatch=/۲\s*خواب|2\s*خواب|دو\s*خواب/i.test(roomText);

if(s.room==='سه خوابه و بیشتر')
roomMatch=/۳\s*خواب|3\s*خواب|۴\s*خواب|4\s*خواب|۵\s*خواب|5\s*خواب/i.test(roomText);

const areaMatch=
x.areaNum>=amin&&
x.areaNum<=amax;

const ageMatch=
!x.ageNum||
(
x.ageNum>=ageMin&&
x.ageNum<=ageMax
);

return(
cityMatch&&
dealMatch&&
typeMatch&&
roomMatch&&
areaMatch&&
ageMatch
);

})

.slice(0,14);

}

function tags(){

return`

<div class="summary">

<span class="tag">
${s.service==='sale'?'خرید ملک':'اجاره ملک'}
</span>

<span class="tag">${esc(s.type)}</span>

<span class="tag">${esc(s.city)}</span>

<span class="tag">${esc(s.room)}</span>

<span class="tag">${esc(s.area)}</span>

<span class="tag">${esc(s.age)}</span>

</div>

`;

}

function showResults(){

s.step=8;

document.getElementById('stepText')
.textContent='نتایج جست‌وجو';

document.getElementById('root').innerHTML=`

<div class="card">

<div class="resultsHead">

<div>

<div class="eyebrow">
AVRIN MATCH
</div>

<h2>
${fa(results.length)}
گزینه منطبق پیدا شد
</h2>

<p>
${s.service==='sale'?'آگهی‌های فروش':'آگهی‌های اجاره'}
در
${esc(s.city)}
</p>

</div>

<button
class="btn secondary"
id="editBtn">
ویرایش اطلاعات جستجو
</button>

</div>

${tags()}

<div class="list">

${
results.length

?

results.map(x=>`

<article
class="listing"
data-id="${esc(x.id)}">

${
x.images.length
?
`<img
class="listingImage"
src="${esc(x.images[0])}"
alt="${esc(x.title)}"
loading="lazy">`
:''
}

<div class="ltop">

<div class="ltitle">
${esc(x.title)}
</div>

<div class="price">
${esc(x.price)}
</div>

</div>

<div class="meta">

<span>
${esc(x.area||'متراژ نامشخص')}
</span>

<span>
${esc(x.rooms||'اتاق نامشخص')}
</span>

<span>
${esc(x.city)}
</span>

<span>
${esc(x.district||'محله نامشخص')}
</span>

</div>

<div class="excerpt">
${esc(String(x.text).split('\\n')[0])}
</div>

<div class="source">
منبع: دیوار · آرشیو اورین
</div>

</article>

`).join('')

:

`
<div class="notice">
در آرشیو فعلی، آگهی‌ای با تمام معیارهای انتخاب‌شده پیدا نشد.
</div>
`
}

</div>

</div>
`;

document.getElementById('editBtn')
.addEventListener('click',editSearch);

document.querySelectorAll('.listing')
.forEach(el=>{

el.addEventListener('click',()=>{
detail(el.dataset.id);
});

});

}

function detail(id){

const x=
results.find(a=>
String(a.id)===String(id)
);

if(!x)return;

document.getElementById('stepText')
.textContent='جزئیات آگهی';

const gallery=
x.images
.slice(0,9)
.map(img=>
`
<img
src="${esc(img)}"
alt="${esc(x.title)}"
loading="lazy">
`
)
.join('');

document.getElementById('root').innerHTML=`

<div class="card detail">

<button
class="btn secondary"
id="detailBack">
← بازگشت به نتایج
</button>

<div class="eyebrow">
${s.service==='sale'
?'آگهی فروش'
:'آگهی اجاره'}
</div>

<h1 class="title">
${esc(x.title)}
</h1>

<div class="price" style="font-size:19px">
${esc(x.price)}
</div>

${
gallery
?
`<div class="gallery">${gallery}</div>`
:''
}

<div class="detailGrid">

<div class="detailItem">
<b>شهر</b>
<span>${esc(x.city||s.city)}</span>
</div>

<div class="detailItem">
<b>محله</b>
<span>${esc(x.district||'نامشخص')}</span>
</div>

<div class="detailItem">
<b>متراژ</b>
<span>${esc(x.area||'نامشخص')}</span>
</div>

<div class="detailItem">
<b>اتاق</b>
<span>${esc(x.rooms||'نامشخص')}</span>
</div>

<div class="detailItem">
<b>نوع معامله</b>
<span>
${s.service==='sale'?'فروش':'اجاره'}
</span>
</div>

<div class="detailItem">
<b>منبع</b>
<span>دیوار</span>
</div>

</div>

<div class="fulltext">
${esc(
x.text||
x.subtitle||
'توضیحات آگهی در داده دریافت‌شده موجود نیست.'
)}
</div>

<div class="actions">

<a
class="btn primary"
href="${esc(x.link)}"
target="_blank"
rel="noopener noreferrer">
مشاهده آگهی اصلی در دیوار
</a>
