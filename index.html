<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار مشاور املاک اورین نکسوس</title>

<style>
:root{
--bg:#0b1017;
--panel:#111923;
--panel2:#172331;
--line:#263547;
--text:#edf3f8;
--muted:#91a2b5;
--accent:#46c6a7;
--accent2:#2aa88c;
}

*{box-sizing:border-box}

body{
margin:0;
background:#070b10;
color:var(--text);
font-family:Tahoma,"Segoe UI",sans-serif
}

.app{
min-height:100vh;
background:linear-gradient(145deg,#0b1017,#0d141d 55%,#101a23);
padding:28px 16px
}

.wrap{
max-width:850px;
margin:auto
}

.head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px
}

.brand{
display:flex;
gap:12px;
align-items:center
}

.logo{
width:42px;
height:42px;
border:1px solid #3b5a67;
border-radius:12px;
display:grid;
place-items:center;
color:var(--accent);
font-weight:800
}

.brand b{
font-size:17px
}

.brand span{
display:block;
color:var(--muted);
font-size:11px;
margin-top:4px
}

.step{
font-size:11px;
color:var(--muted)
}

.bar{
height:5px;
background:#18232f;
border-radius:8px;
overflow:hidden;
margin-bottom:22px
}

.bar i{
display:block;
height:100%;
background:var(--accent);
transition:.25s;
width:14%
}

.card{
background:rgba(17,25,35,.96);
border:1px solid var(--line);
border-radius:20px;
padding:26px;
box-shadow:0 18px 50px #0006
}

.eyebrow{
color:var(--accent);
font-size:12px;
margin-bottom:10px
}

.title{
font-size:24px;
font-weight:800;
line-height:1.6;
margin:0 0 8px
}

.desc{
color:#b4c0cd;
line-height:2;
font-size:13px;
margin:0 0 22px
}

.input{
width:100%;
background:#0c141d;
border:1px solid #334558;
color:#fff;
border-radius:12px;
padding:14px;
font-size:15px;
outline:none
}

.input:focus{
border-color:var(--accent)
}

.counter{
font-size:11px;
color:var(--muted);
margin-top:7px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:11px
}

.choice{
background:#0d151e;
border:1px solid #2a394a;
color:#dce6ee;
border-radius:13px;
padding:15px;
text-align:right;
cursor:pointer;
font-size:14px;
transition:.15s
}

.choice:hover,
.choice.selected{
border-color:var(--accent);
background:#11251f
}

.actions{
display:flex;
gap:9px;
margin-top:22px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:12px;
padding:12px 18px;
cursor:pointer;
font-weight:700;
text-decoration:none;
display:inline-block
}

.primary{
background:var(--accent);
color:#07120f
}

.secondary{
background:#1a2735;
color:#d8e1e9;
border:1px solid #304254
}

.summary{
display:flex;
flex-wrap:wrap;
gap:7px;
margin:16px 0
}

.tag{
border:1px solid #2d4052;
background:#0d151e;
color:#b9c8d5;
border-radius:20px;
padding:7px 10px;
font-size:11px
}

.resultsHead{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px;
margin-bottom:15px
}

.resultsHead h2{
margin:0;
font-size:20px
}

.resultsHead p{
color:var(--muted);
font-size:11px;
margin:7px 0 0
}

.list{
display:grid;
gap:10px
}

.listing{
border:1px solid #29394a;
background:#0c141d;
border-radius:15px;
padding:16px;
cursor:pointer
}

.listing:hover{
border-color:#4c6977
}

.ltop{
display:flex;
justify-content:space-between;
gap:12px
}

.ltitle{
font-weight:800;
line-height:1.7;
font-size:14px
}

.price{
color:var(--accent);
font-weight:800;
white-space:nowrap;
font-size:13px
}

.meta{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:10px 0
}

.meta span{
font-size:10px;
color:#aebdca;
background:#16212d;
border-radius:8px;
padding:6px 8px
}

.excerpt{
color:#899aaa;
font-size:11px;
line-height:1.9
}

.source{
color:#62778b;
font-size:10px;
margin-top:9px
}

.detail .back{
margin-bottom:15px
}

.detailGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:15px
}

.detailItem{
background:#101b26;
border-radius:10px;
padding:10px
}

.detailItem b{
display:block;
font-size:10px;
color:#74889b;
margin-bottom:5px
}

.detailItem span{
font-size:12px
}

.fulltext{
white-space:pre-line;
color:#b8c4cf;
font-size:12px;
line-height:2.15;
background:#0b131c;
border:1px solid #253546;
border-radius:13px;
padding:15px;
margin-top:15px
}

.loading{
text-align:center;
padding:50px 10px
}

.spinner{
width:34px;
height:34px;
border:3px solid #294052;
border-top-color:var(--accent);
border-radius:50%;
animation:spin .8s linear infinite;
margin:0 auto 16px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.notice{
background:#15231f;
border:1px solid #2e5b50;
color:#a9d8cc;
padding:11px 13px;
border-radius:11px;
font-size:11px;
line-height:1.8;
margin-top:12px
}

.empty{
text-align:center;
padding:25px 10px
}

@media(max-width:600px){

.app{
padding:18px 10px
}

.card{
padding:19px
}

.grid{
grid-template-columns:1fr
}

.title{
font-size:20px
}

.ltop{
display:block
}

.price{
display:block;
margin-top:7px
}

.detailGrid{
grid-template-columns:1fr
}

.resultsHead{
display:block
}

.resultsHead .btn{
margin-top:12px
}

}
</style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="Content-Language" content="fa">
</head>

<body>

<main class="app">

<div class="wrap">

<header class="head">

<div class="brand">

<div class="logo">E</div>

<div>
<b>Evren Nexus</b>
<span>دستیار مشاور املاک اورین نکسوس</span>
</div>

</div>

<div class="step" id="stepText">
مرحله ۱ از ۷
</div>

</header>

<div class="bar">
<i id="bar"></i>
</div>

<section id="root"></section>

</div>

</main>


<script>

const cities=[
'تهران',
'مشهد',
'تبریز',
'استانبول',
'ازمیر',
'آنتالیا'
];

const iranCities={
'تهران':'tehran',
'مشهد':'mashhad',
'تبریز':'tabriz'
};

const types=[
'مسکونی',
'تجاری',
'اداری',
'خدماتی',
'ورزشی',
'آموزشی',
'بهداشتی و درمانی',
'زمین',
'ویلا'
];

const rooms=[
'سوییت',
'تک خوابه',
'دو خوابه',
'سه خوابه و بیشتر'
];

const areas=[
'زیر ۶۰',
'۶۰–۷۰',
'۷۰–۸۰',
'۸۰–۹۰',
'۹۰–۱۲۰',
'۱۲۰–۱۵۰',
'بزرگتر از ۱۵۰'
];

const ages=[
'نوساز کلید نخورده',
'۱–۵ سال',
'۵–۱۰ سال',
'۱۰–۲۰ سال',
'بیشتر از ۲۰'
];

let s={
step:1,
username:'',
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];


function fa(n){

return String(n).replace(
/\d/g,
d=>'۰۱۲۳۴۵۶۷۸۹'[d]
);

}


function normalize(v){

return String(v ?? '')
.trim()
.toLowerCase()
.replace(/[ي]/g,'ی')
.replace(/[ك]/g,'ک')
.replace(/[ۀ]/g,'ه');

}


function escapeHTML(value){

return String(value ?? '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


function render(){

document.getElementById('stepText').textContent=
s.step<=7
?`مرحله ${fa(s.step)} از ۷`
:'';

document.getElementById('bar').style.width=
(s.step<=7?s.step/7*100:100)+'%';

let r=document.getElementById('root');

if(s.step===1){
return intro(r);
}

if(s.step===2){

return choices(
r,
'نوع خدمت',
'برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:',
[
['خرید ملک','خرید'],
['اجاره ملک','اجاره']
],
'service'
);

}

if(s.step===3){

return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

}

if(s.step===4){

return choices(
r,
'شهر',
s.service==='خرید'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

}

if(s.step===5){

return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

}

if(s.step===6){

return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

}

if(s.step===7){

return choices(
r,
'سن بنا',
'سن بنای مورد نظر را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);

}

}


function intro(r){

r.innerHTML=`

<div class="card">

<div class="eyebrow">
EVREN NEXUS · AVRIN
</div>

<h1 class="title">
سلام، من دستیار مشاور املاک اورین نکسوس هستم.
</h1>

<p class="desc">

هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها،
به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.

<br>

این خدمات در حال حاضر رایگان ارائه می‌شود.

<br><br>

برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.
نام کاربری می‌تواند فارسی یا انگلیسی باشد و هیچ محدودیت تعداد کاراکتر ندارد.

</p>

<input
id="u"
class="input"
value="${escapeHTML(s.username)}"
placeholder="نام کاربری خود را وارد کنید"
>

<div id="count" class="counter">
${fa(s.username.length)} کاراکتر
</div>

<div class="actions">

<button
class="btn primary"
id="startBtn"
type="button"
>
شروع مشاوره
</button>

</div>

</div>
`;

const input=document.getElementById('u');

input.addEventListener('input',function(){

s.username=this.value;

document.getElementById('count').textContent=
fa(this.value.length)+' کاراکتر';

});

document.getElementById('startBtn')
.addEventListener('click',nextUser);

}


function choices(r,ey,desc,items,key){

let back=
s.step>1
?`<button class="btn secondary" id="backBtn" type="button">بازگشت</button>`
:'';

r.innerHTML=`

<div class="card">

<div class="eyebrow">
${escapeHTML(ey)}
</div>

<h1 class="title">
${escapeHTML(desc)}
</h1>

<div class="grid">

${items.map(([label,val])=>`

<button
class="choice ${s[key]===val?'selected':''}"
data-key="${escapeHTML(key)}"
data-value="${escapeHTML(val)}"
type="button"
>

${escapeHTML(label)}

</button>

`).join('')}

</div>

<div class="actions">

${back}

${
editing
?
'<button class="btn secondary" id="resultsBtn" type="button">بازگشت به نتایج</button>'
:''
}

</div>

</div>
`;

document.querySelectorAll('.choice').forEach(btn=>{

btn.addEventListener('click',function(){

pick(
this.dataset.key,
this.dataset.value
);

});

});

const backBtn=document.getElementById('backBtn');

if(backBtn){
backBtn.addEventListener('click',prevStep);
}

const resultsBtn=document.getElementById('resultsBtn');

if(resultsBtn){
resultsBtn.addEventListener('click',showResults);
}

}


function nextUser(){

if(!s.username.trim()){

alert('لطفاً یک نام کاربری وارد کنید.');

return;

}

s.username=s.username.trim();

s.step=2;

render();

}


function pick(k,v){

s[k]=v;

s.step++;

if(s.step===8){

searching();

}else{

render();

}

}


function prevStep(){

if(s.step>1&&s.step<=7){

s.step--;

render();

}else if(s.step===8){

showResults();

}

}


async function searching(){

document.getElementById('stepText').textContent=
'جست‌وجوی گزینه‌ها';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال جست‌وجوی آگهی‌های واقعی ذخیره‌شده است.
</p>

</div>
`;

try{

const response=
await fetch('./data/listings.json?'+Date.now());

if(!response.ok){

throw new Error('HTTP '+response.status);

}

const data=await response.json();

results=filterListings(
Array.isArray(data)?data:[]
);

showResults();

}catch(e){

document.getElementById('root').innerHTML=`

<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
</p>

<div class="notice">
${escapeHTML(e.message)}
</div>

<div class="actions">

<button
class="btn primary"
id="retryBtn"
type="button"
>
تلاش دوباره
</button>

</div>

</div>
`;

document.getElementById('retryBtn')
.addEventListener('click',searching);

}

}


function normalizeCity(city){

const c=normalize(city);

if(
c==='tehran'||
c.includes('تهران')
)return 'tehran';

if(
c==='mashhad'||
c.includes('مشهد')
)return 'mashhad';

if(
c==='tabriz'||
c.includes('تبریز')
)return 'tabriz';

return c;

}


function getDealType(x){

const value=
normalize(
x.dealType ||
x.deal_type ||
x.transactionType ||
x.service ||
''
);

if(
value==='sale' ||
value==='فروش' ||
value.includes('sale')
){
return 'sale';
}

if(
value==='rent' ||
value==='اجاره' ||
value.includes('rent')
){
return 'rent';
}

return '';

}


function getCity(x){

return normalizeCity(
x.sourceCity ||
x.city ||
x.cityName ||
x['شهر'] ||
''
);

}


function filterListings(data){

const wantedCity=
iranCities[s.city] || normalizeCity(s.city);

const wantedDeal=
s.service==='خرید'
?'sale'
:'rent';

return data

.filter(x=>{

const city=getCity(x);

return city===wantedCity;

})

.filter(x=>{

const deal=getDealType(x);

return deal===wantedDeal;

})

.slice(0,14)

.map((x,i)=>{

const title=
x.title ||
x.name ||
x.heading ||
'آگهی ملک';

const text=
x.description ||
x.text ||
x.body ||
x.content ||
'';

const area=
x.area ||
x.meterage ||
x.size ||
x.area_m2 ||
x['متراژ'] ||
'';

const roomsValue=
x.rooms ||
x.room ||
x.bedrooms ||
x['اتاق'] ||
'';

const age=
x.age ||
x.buildingAge ||
x['سن بنا'] ||
'';

const price=
x.priceText ||
x.price ||
x['قیمت'] ||
'قیمت توافقی';

const link=
x.url ||
x.link ||
x.webUrl ||
x.shareUrl ||
'#';

return{

...x,

id:x.token || x.id || x.adInstanceId || i+1,

title:title,

text:text,

area:area,

rooms:roomsValue,

age:age,

city:s.city,

district:
x.district ||
x.neighborhood ||
'',

price:price,

link:link,

dealType:getDealType(x)

};

});

}


function tags(){

return `

<div class="summary">

<span class="tag">
${escapeHTML(s.service)}
</span>

<span class="tag">
${escapeHTML(s.type)}
</span>

<span class="tag">
${escapeHTML(s.city)}
</span>

<span class="tag">
${escapeHTML(s.room)}
</span>

<span class="tag">
${escapeHTML(s.area)}
</span>

<span class="tag">
${escapeHTML(s.age)}
</span>

</div>

`;

}


function showResults(){

s.step=8;

document.getElementById('stepText').textContent=
'نتایج جست‌وجو';

document.getElementById('bar').style.width='100%';

let list='';

if(results.length){

list=results.map(x=>`

<article
class="listing"
data-id="${escapeHTML(x.id)}"
>

<div class="ltop">

<div class="ltitle">
${escapeHTML(x.title)}
</div>

<div class="price">
${escapeHTML(x.price)}
</div>

</div>

<div class="meta">

<span>
${x.area?escapeHTML(x.area):'متراژ نامشخص'}
</span>

<span>
${x.rooms?escapeHTML(x.rooms):'اتاق نامشخص'}
</span>

<span>
${x.age?escapeHTML(x.age):'سن بنا نامشخص'}
</span>

<span>
${escapeHTML(x.city)}
</span>

${
x.district
?
`<span>${escapeHTML(x.district)}</span>`
:''
}

<span>
${x.dealType==='sale'?'فروش':'اجاره'}
</span>

</div>

<div class="excerpt">

${escapeHTML(
String(x.text||'')
.split('\n')[0]
)}

</div>

<div class="source">
منبع: آرشیو آگهی‌های اورین · دیوار
</div>

</article>

`).join('');

}else{

list=`

<div class="empty">

<div class="eyebrow">
AVRIN MATCH
</div>

<h3>
آگهی منطبقی پیدا نشد
</h3>

<p class="desc">
در آرشیو فعلی برای ${escapeHTML(s.city)}
در بخش ${escapeHTML(s.service)}
آگهی منطبق با این جست‌وجو پیدا نشد.
</p>

</div>

`;

}


document.getElementById('root').innerHTML=`

<div class="card">

<div class="resultsHead">

<div>

<div class="eyebrow">
AVRIN MATCH
</div>

<h2>
${fa(results.length)} گزینه منطبق پیدا شد
</h2>

<p>
گزینه‌ها از آرشیو واقعی آگهی‌های دریافت‌شده برای اورین انتخاب شده‌اند.
</p>

</div>

<button
class="btn secondary"
id="editBtn"
type="button"
>
ویرایش اطلاعات جست‌وجو
</button>

</div>

${tags()}

<div class="list">
${list}
</div>

<div class="actions">

<button
class="btn primary"
id="contactBtn"
type="button"
>
ارائه اطلاعات برای مشاوره دقیق‌تر
</button>

</div>

</div>
`;


document.querySelectorAll('.listing')
.forEach(item=>{

item.addEventListener('click',function(){

detail(this.dataset.id);

});

});


document.getElementById('editBtn')
.addEventListener('click',editSearch);

document.getElementById('contactBtn')
.addEventListener('click',showContact);

}


function detail(id){

const x=results.find(
a=>String(a.id)===String(id)
);

if(!x)return;


document.getElementById('stepText').textContent=
'جزئیات آگهی';


document.getElementById('root').innerHTML=`

<div class="card detail">

<button
class="btn secondary back"
id="detailBack"
type="button"
>
← بازگشت به نتایج
</button>

<div class="eyebrow">
جزئیات گزینه
</div>

<h1 class="title">
${escapeHTML(x.title)}
</h1>

<div class="price" style="font-size:18px">
${escapeHTML(x.price)}
</div>


<div class="detailGrid">

<div class="detailItem">
<b>نوع معامله</b>
<span>
${x.dealType==='sale'?'فروش':'اجاره'}
</span>
</div>

<div class="detailItem">
<b>شهر</b>
<span>
${escapeHTML(x.city)}
</span>
</div>

<div class="detailItem">
<b>محله</b>
<span>
${escapeHTML(x.district||'نامشخص')}
</span>
</div>

<div class="detailItem">
<b>متراژ</b>
<span>
${escapeHTML(x.area||'نامشخص')}
</span>
</div>

<div class="detailItem">
<b>اتاق</b>
<span>
${escapeHTML(x.rooms||'نامشخص')}
</span>
</div>

<div class="detailItem">
<b>سن بنا</b>
<span>
${escapeHTML(x.age||'نامشخص')}
</span>
</div>

</div>


<div class="fulltext">

${escapeHTML(
x.text ||
'توضیحات آگهی در داده دریافت‌شده موجود نیست.'
)}

</div>


<div class="actions">

${
x.link && x.link!=='#'
?
`
<a
class="btn primary"
href="${escapeHTML(x.link)}"
target="_blank"
rel="noopener noreferrer"
>
مشاهده آگهی اصلی در دیوار
</a>
`
:
''
}

<button
class="btn secondary"
id="detailEdit"
type="button"
>
ویرایش اطلاعات جست‌وجو
</button>

</div>

</div>

`;


document.getElementById('detailBack')
.addEventListener('click',showResults);

document.getElementById('detailEdit')
.addEventListener('click',editSearch);

}


function editSearch(){

editing=true;

s.step=2;

render();

}


function contactForm(){

return `

<div class="card">

<div class="eyebrow">
اطلاعات تماس
</div>

<h1 class="title">
اطلاعات تماس برای ادامه
</h1>

<p class="desc">
لطفاً نام خود را وارد کنید و حداقل یکی از شماره تلفن یا ایمیل را ثبت نمایید.
</p>

<input
id="cname"
class="input"
placeholder="نام و نام خانوادگی"
>

<div style="height:10px"></div>

<input
id="cphone"
class="input"
type="tel"
inputmode="tel"
placeholder="شماره تلفن (اختیاری)"
>

<div style="height:10px"></div>

<input
id="cemail"
class="input"
type="email"
placeholder="ایمیل (اختیاری)"
>

<div class="actions">

<button
class="btn primary"
id="saveContact"
type="button"
>
ثبت اطلاعات
</button>

<button
class="btn secondary"
id="cancelContact"
type="button"
>
بازگشت به نتایج
</button>

</div>

</div>

`;

}


function finishContact(){

const name=
document.getElementById('cname')
.value.trim();

const phone=
document.getElementById('cphone')
.value.trim();

const email=
document.getElementById('cemail')
.value.trim();


if(!name){

alert('لطفاً نام خود را وارد کنید.');

return;

}

if(!phone&&!email){

alert(
'لطفاً حداقل شماره تلفن یا ایمیل را وارد کنید.'
);

return;

}


const lead={

username:s.username,

service:s.service,

type:s.type,

city:s.city,

room:s.room,

area:s.area,

age:s.age,

name:name,

phone:phone,

email:email,

shownListings:

results.map(x=>({

id:x.id,

title:x.title,

price:x.price,

link:x.link

})),

createdAt:new Date().toISOString()

};


const leads=
JSON.parse(
localStorage.getItem('avrin_leads')||'[]'
);


leads.push(lead);

localStorage.setItem(
'avrin_leads',
JSON.stringify(leads)
);


showResults();

}


function showContact(){

document.getElementById('stepText').textContent=
'اطلاعات تماس';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=
contactForm();


document.getElementById('saveContact')
.addEventListener('click',finishContact);


document.getElementById('cancelContact')
.addEventListener('click',showResults);

}


render();

</script>

</body>
</html>
