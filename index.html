<body>
<main class="app">
<div class="wrap">

<header class="head">
<div class="brand">

<b>Evren Nexus</b>

</div>

<div class="step" id="stepText">مرحله ۱ از ۷</div>
</header>

<div class="bar"><i id="bar"></i></div>
<section id="root"></section>

</div>
</main>

<script>
const cities=['تهران','مشهد','تبریز','استانبول','ازمیر','آنتالیا'];
const types=['مسکونی','تجاری','اداری','خدماتی','ورزشی','آموزشی','بهداشتی و درمانی','زمین','ویلا'];
const rooms=['سوییت','تک خوابه','دو خوابه','سه خوابه و بیشتر'];
const areas=['زیر ۶۰','۶۰–۷۰','۷۰–۸۰','۸۰–۹۰','۹۰–۱۲۰','۱۲۰–۱۵۰','بزرگتر از ۱۵۰'];
const ages=['نوساز کلید نخورده','۱–۵ سال','۵–۱۰ سال','۱۰–۲۰ سال','بیشتر از ۲۰'];

let s={
step:1,
username:'',
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function esc(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function render(){

document.getElementById('stepText').textContent=
s.step<=7?`مرحله ${fa(s.step)} از ۷`:'';

document.getElementById('bar').style.width=
(s.step<=7?s.step/7*100:100)+'%';

let r=document.getElementById('root');

if(s.step===1)return intro(r);

if(s.step===2)
return choices(
r,
'نوع خدمت',
'برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:',
[['خرید ملک','خرید'],['اجاره ملک','اجاره']],
'service'
);

if(s.step===3)
return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

if(s.step===4)
return choices(
r,
'شهر',
s.service==='خرید'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

if(s.step===5)
return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

if(s.step===6)
return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

if(s.step===7)
return choices(
r,
'سن بنا',
'سن بنای مورد نظر خود را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);
}

function intro(r){

r.innerHTML=`
<div class="card">

<div class="eyebrow">EVREN NEXUS · AVRIN</div>

<h1 class="title">
سلام، من دستیار مشاور املاک اورین نکسوس هستم.
</h1>

<p class="desc">
هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها، به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.
<br>
این خدمات در حال حاضر رایگان ارائه می‌شود.
<br><br>
برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.
نام کاربری می‌تواند فارسی یا انگلیسی باشد و هیچ محدودیت تعداد کاراکتر ندارد.
</p>

<input
id="u"
class="input"
value="${esc(s.username)}"
placeholder="نام کاربری خود را وارد کنید"
>

<div id="count" class="counter">
${s.username.length} کاراکتر
</div>

<div class="actions">
<button type="button" class="btn primary" id="startBtn">
شروع مشاوره
</button>
</div>

</div>
`;

document.getElementById('u').addEventListener('input',function(){
s.username=this.value;
document.getElementById('count').textContent=
this.value.length+' کاراکتر';
});

document.getElementById('startBtn')
.addEventListener('click',nextUser);
}

function choices(r,ey,desc,items,key){

let html=`
<div class="card">

<div class="eyebrow">${esc(ey)}</div>

<h1 class="title">${esc(desc)}</h1>

<div class="grid">
`;

items.forEach((item,i)=>{

html+=`
<button
type="button"
class="choice ${s[key]===item[1]?'selected':''}"
data-choice="${i}"
>
${esc(item[0])}
</button>
`;

});

html+=`</div><div class="actions">`;

if(s.step>1)
html+=`
<button type="button" class="btn secondary" id="backBtn">
بازگشت
</button>
`;

if(editing)
html+=`
<button type="button" class="btn secondary" id="resultsBtn">
بازگشت به نتایج
</button>
`;

html+=`</div></div>`;

r.innerHTML=html;

r.querySelectorAll('[data-choice]').forEach(btn=>{
btn.addEventListener('click',()=>{
pick(
key,
items[Number(btn.dataset.choice)][1]
);
});
});

const b=document.getElementById('backBtn');
const q=document.getElementById('resultsBtn');

if(b)b.addEventListener('click',prevStep);
if(q)q.addEventListener('click',showResults);
}

function nextUser(){

if(!s.username.trim()){
alert('لطفاً یک نام کاربری وارد کنید.');
return;
}

s.username=s.username.trim();
s.step=2;
render();
}

function pick(k,v){

s[k]=v;
s.step++;

if(s.step===8)
searching();
else
render();
}

function prevStep(){

if(s.step>1&&s.step<=7){
s.step--;
render();
}
else if(s.step===8){
showResults();
}
}

async function searching(){

document.getElementById('stepText').textContent='جست‌وجوی گزینه‌ها';
document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`
<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال جست‌وجوی آگهی‌های واقعی ذخیره‌شده است.
</p>

</div>
`;

try{

const response=await fetch(
'./data/listings.json?'+Date.now()
);

if(!response.ok)
throw new Error('HTTP '+response.status);

const data=await response.json();

results=filterListings(
Array.isArray(data)?data:[]
);

showResults();

}catch(e){

document.getElementById('root').innerHTML=`
<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
لطفاً دوباره تلاش کنید.
</p>

<div class="notice">
${esc(e.message)}
</div>

<div class="actions">

<button
type="button"
class="btn primary"
id="retryBtn"
>
تلاش دوباره
</button>

</div>

</div>
`;

document.getElementById('retryBtn')
.addEventListener('click',searching);
}
}

function filterListings(data){

const normalize=v=>
String(v??'').trim().toLowerCase();

const city=normalize(s.city);
const room=normalize(s.room);
const type=normalize(s.type);

const ageRanges={
'نوساز کلید نخورده':[0,0],
'۱–۵ سال':[1,5],
'۵–۱۰ سال':[5,10],
'۱۰–۲۰ سال':[10,20],
'بیشتر از ۲۰':[20,9999]
};

const areaRanges={
'زیر ۶۰':[0,59],
'۶۰–۷۰':[60,70],
'۷۰–۸۰':[70,80],
'۸۰–۹۰':[80,90],
'۹۰–۱۲۰':[90,120],
'۱۲۰–۱۵۰':[120,150],
'بزرگتر از ۱۵۰':[150,99999]
};

const [amin,amax]=
areaRanges[s.area]||[0,99999];

const [ageMin,ageMax]=
ageRanges[s.age]||[0,99999];

return data

.map((x,i)=>{

const title=
x.title||
x.name||
x.heading||
'آگهی ملک';

const text=
x.description||
x.text||
x.body||
x.content||
'';

const rawArea=
x.area||
x.meterage||
x.size||
x.area_m2||
x['متراژ']||
0;

const areaNum=
Number(
String(rawArea).replace(/[^0-9.]/g,'')
)||0;

const rawAge=
x.age||
x.buildingAge||
x['سن بنا']||
0;

const ageNum=
Number(
String(rawAge).replace(/[^0-9.]/g,'')
)||0;

const rawCity=
x.city||
x.cityName||
x['شهر']||
'';

const rawType=
x.type||
x.category||
x.categoryName||
x['نوع ملک']||
'';

const rawRoom=
x.rooms||
x.room||
x.bedrooms||
x['اتاق']||
'';

const link=
x.url||
x.link||
x.webUrl||
x.shareUrl||
'#';

const price=
x.price||
x.priceText||
x['قیمت']||
'قیمت توافقی';

return{
...x,
id:x.id||x.token||i+1,
title,
text,
area:areaNum?fa(areaNum)+' متر':'',
areaNum,
age:ageNum?fa(ageNum)+' سال':'نامشخص',
ageNum,
city:rawCity,
type:rawType,
rooms:rawRoom,
price,
link
};

})

.filter(x=>
!city||
normalize(x.city).includes(city)||
normalize(city).includes(normalize(x.city))
)

.filter(x=>
!type||
normalize(x.type).includes(type)||
normalize(type).includes(normalize(x.type))
)

.filter(x=>
!room||
normalize(x.rooms).includes(room)||
normalize(room).includes(normalize(x.rooms))
)

.filter(x=>
x.areaNum>=amin&&
x.areaNum<=amax
)

.filter(x=>
x.ageNum>=ageMin&&
x.ageNum<=ageMax
)

.slice(0,14);
}

در آرشیو فعلی، آگهی‌ای با تمام معیارهای انتخاب‌شده پیدا نشد.

}

html+=`
</div>

<div class="actions">

<button
type="button"
class="btn primary"

ارائه اطلاعات برای مشاوره دقیق‌تر

</div>

</div>
`;

r.innerHTML=html;

document.getElementById('editBtn')
.addEventListener('click',editSearch);

document.getElementById('contactBtn')
.addEventListener('click',showContact);

results[Number(el.dataset.result)].id
