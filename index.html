<body>

<main class="app">
<div class="wrap">

<header class="head">
<div class="brand">
<div class="logo">E</div>
<div>
<b>Evren Nexus</b>
<span>موتور جستجوی املاک اورین نکسوس</span>
</div>
</div>

<div class="step" id="stepText">مرحله ۱ از ۶</div>
</header>

<div class="bar">
<i id="bar"></i>
</div>

<section id="root"></section>

<footer class="foot">
Evren Nexus · Avrin Property Search
</footer>

</div>
</main>

<script>

const cities=[
'تهران',
'مشهد',
'تبریز',
'استانبول',
'ازمیر',
'آنتالیا'
];

const types=[
'مسکونی',
'تجاری',
'اداری',
'خدماتی',
'ورزشی',
'آموزشی',
'بهداشتی و درمانی',
'زمین',
'ویلا'
];

const rooms=[
'سوییت',
'تک خوابه',
'دو خوابه',
'سه خوابه و بیشتر'
];

const areas=[
'زیر ۶۰',
'۶۰–۷۰',
'۷۰–۸۰',
'۸۰–۹۰',
'۹۰–۱۲۰',
'۱۲۰–۱۵۰',
'بزرگتر از ۱۵۰'
];

const ages=[
'نوساز کلید نخورده',
'۱–۵ سال',
'۵–۱۰ سال',
'۱۰–۲۰ سال',
'بیشتر از ۲۰'
];

const TURNSTILE_SITEKEY='YOUR_TURNSTILE_SITE_KEY';

const LEAD_ENDPOINT='YOUR_BACKEND_ENDPOINT';

let s={
step:1,
service:'',
type:'',
city:'',
room:'',
area:'',
age:''
};

let editing=false;
let results=[];
let currentChoices={key:'',values:[]};

const fa=n=>
String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function esc(v){
return String(v??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

function normalize(v){
return String(v??'').trim().toLowerCase();
}

function render(){

document.getElementById('stepText').textContent=
s.step<=6
?`مرحله ${fa(s.step)} از ۶`
:'';

document.getElementById('bar').style.width=
(s.step<=6?s.step/6*100:100)+'%';

const r=document.getElementById('root');

if(s.step===1)
return choices(
r,
'نوع معامله',
'لطفا نوع معامله مورد نظر خود را انتخاب نمایید:',
[
['خرید ملک','خرید'],
['اجاره ملک','اجاره']
],
'service'
);

if(s.step===2)
return choices(
r,
'نوع ملک',
'نوع ملک مورد نظر خود را انتخاب نمایید:',
types.map(x=>[x,x]),
'type'
);

if(s.step===3)
return choices(
r,
'شهر',
s.service==='خرید'
?'لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:'
:'لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:',
cities.map(x=>[x,x]),
'city'
);

if(s.step===4)
return choices(
r,
'تعداد اتاق',
'تعداد اتاق خواب مورد نظر را انتخاب نمایید:',
rooms.map(x=>[x,x]),
'room'
);

if(s.step===5)
return choices(
r,
'متراژ',
'متراژ مورد نظر خود را انتخاب نمایید:',
areas.map(x=>[x,x]),
'area'
);

if(s.step===6)
return choices(
r,
'سن بنا',
'سن بنای مورد نظر خود را انتخاب نمایید:',
ages.map(x=>[x,x]),
'age'
);

}

function choices(r,ey,desc,items,key){

const back=
s.step>1
?'<button class="btn secondary" onclick="prevStep()">بازگشت</button>'
:'';

currentChoices={
key:key,
values:items.map(x=>x[1])
};

r.innerHTML=`

<div class="card">

<div class="eyebrow">
${esc(ey)}
</div>

<h1 class="title">
${esc(desc)}
</h1>

<div class="grid">

${items.map(([label,val],i)=>`

<button
class="choice ${s[key]===val?'selected':''}"
onclick="pick('${key}',${i})">

${esc(label)}

</button>

`).join('')}

</div>

<div class="actions">
${back}
${editing
?'<button class="btn secondary" onclick="showResults()">بازگشت به نتایج</button>'
:''
}
</div>

</div>

`;

}

function pick(k,index){

if(
currentChoices.key!==k||
index<0||
index>=currentChoices.values.length
)
return;

s[k]=currentChoices.values[index];

if(k==='service'){
s.type='';
s.city='';
s.room='';
s.area='';
s.age='';
}

s.step++;

if(s.step===7)
searching();
else
render();

}

function prevStep(){

if(
s.step>1&&
s.step<=6
){
s.step--;
render();
}

}

async function searching(){

document.getElementById('stepText').textContent=
'جست‌وجوی گزینه‌ها';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی آگهی‌های منطبق...
</h2>

<p class="desc">
اورین در حال بررسی آرشیو آگهی‌های دریافت‌شده از دیوار است.
</p>

</div>

`;

try{

const response=
await fetch(
'./data/listings.json?'+Date.now()
);

if(!response.ok)
throw new Error('HTTP '+response.status);

const data=
await response.json();

results=
filterListings(
Array.isArray(data)?data:[]
);

showResults();

}catch(e){

document.getElementById('root').innerHTML=`

<div class="card">

<div class="eyebrow">
خطا در دریافت داده
</div>

<h1 class="title">
داده آگهی‌ها در دسترس نیست
</h1>

<p class="desc">
اتصال به آرشیو آگهی‌های اورین با مشکل مواجه شد.
</p>

<div class="notice">
${esc(e.message)}
</div>

<div class="actions">

<button
class="btn primary"
onclick="searching()">
تلاش دوباره
</button>

</div>

</div>

`;

}

}

function detectType(x){

const text=
normalize([
x.type,
x.category,
x.categoryName,
x.tags,
x.title,
x.subtitle,
x.description
].join(' '));

if(text.includes('ویلا'))
return 'ویلا';

if(text.includes('زمین'))
return 'زمین';

if(
text.includes('تجاری')||
text.includes('مغازه')||
text.includes('فروشگاه')
)
return 'تجاری';

if(
text.includes('اداری')||
text.includes('دفتر')
)
return 'اداری';

if(
text.includes('آموزشی')||
text.includes('مدرسه')
)
return 'آموزشی';

if(
text.includes('ورزشی')||
text.includes('باشگاه')
)
return 'ورزشی';

if(
text.includes('درمانی')||
text.includes('پزشکی')||
text.includes('کلینیک')
)
return 'بهداشتی و درمانی';

if(text.includes('خدماتی'))
return 'خدماتی';

return 'مسکونی';

}

function detectRoom(x){

const text=[
x.rooms,
x.room,
x.bedrooms,
x.tags,
x.title,
x.subtitle,
x.description
].join(' ');

if(/سوییت|استودیو|بدون خواب/i.test(text))
return 'سوییت';

if(/۱\s*خواب|یک\s*خواب/i.test(text))
return 'تک خوابه';

if(/۲\s*خواب|دو\s*خواب/i.test(text))
return 'دو خوابه';

if(
/۳\s*خواب|۴\s*خواب|۵\s*خواب|سه\s*خواب|چهار\s*خواب/i.test(text)
)
return 'سه خوابه و بیشتر';

return '';

}

function detectArea(x){

const raw=
x.area||
x.meterage||
x.size||
x.area_m2||
x['متراژ']||
'';

let n=
Number(
String(raw).replace(/[^0-9.]/g,'')
)||0;

if(!n){

const text=[
x.title,
x.subtitle,
x.tags,
x.description
].join(' ');

const m=
text.match(
/(\d{2,4})\s*(?:متر|مترمربع|متری)/
);

if(m)
n=Number(m[1]);

}

return n;

}

function detectAge(x){

const raw=
x.age||
x.buildingAge||
x['سن بنا']||
'';

let n=
Number(
String(raw).replace(/[^0-9.]/g,'')
)||0;

if(!n){

const text=[
x.title,
x.subtitle,
x.tags,
x.description
].join(' ');

const m=
text.match(
/(\d{1,2})\s*(?:سال|ساله)/
);

if(m)
n=Number(m[1]);

}

return n;

}

function areaMatch(n){

const ranges={
'زیر ۶۰':[0,59],
'۶۰–۷۰':[60,70],
'۷۰–۸۰':[70,80],
'۸۰–۹۰':[80,90],
'۹۰–۱۲۰':[90,120],
'۱۲۰–۱۵۰':[120,150],
'بزرگتر از ۱۵۰':[150,999999]
};

const r=ranges[s.area];

if(!r||!n)
return true;

return n>=r[0]&&n<=r[1];

}

function ageMatch(n){

const ranges={
'نوساز کلید نخورده':[0,0],
'۱–۵ سال':[1,5],
'۵–۱۰ سال':[5,10],
'۱۰–۲۰ سال':[10,20],
'بیشتر از ۲۰':[20,9999]
};

const r=ranges[s.age];

if(!r||!n)
return true;

return n>=r[0]&&n<=r[1];

}

function filterListings(data){

const wantedDeal=
s.service==='خرید'
?'sale'
:
s.service==='اجاره'
?'rent'
:'';

return data

.map((x,i)=>{

const areaNum=detectArea(x);
const ageNum=detectAge(x);

const title=
x.title||
x.name||
x.heading||
'آگهی ملک';

const text=
x.description||
x.text||
x.body||
x.content||
x.subtitle||
'';

const link=
x.url||
x.link||
x.webUrl||
x.shareUrl||
'#';

const price=
x.priceText||
x.price||
x['قیمت']||
'قیمت توافقی';

const type=
detectType(x);

const rooms=
detectRoom(x);

const images=
Array.isArray(x.images)
?x.images
:
x.thumbnailUrl
?[x.thumbnailUrl]
:[];

return{

...x,

id:x.token||x.id||i,

title,
text,
price,
link,
images,

areaNum,

area:
areaNum
?fa(areaNum)+' متر'
:'',

ageNum,

age:
ageNum
?fa(ageNum)+' سال'
:'نامشخص',

city:
x.city||
x.cityName||
x['شهر']||
'',

district:
x.district||
x.neighborhood||
'',

type,
rooms

};

})

.filter(x=>{

if(wantedDeal){

const deal=
normalize(
x.dealType||
x.typeOfDeal||
''
);

if(
deal &&
deal!==wantedDeal
)
return false;

}

if(s.city){

const c=normalize(s.city);
const xc=normalize(x.city);

if(
xc &&
!xc.includes(c) &&
!c.includes(xc)
)
return false;

}

if(s.type&&x.type!==s.type)
return false;

if(
s.room&&
x.rooms&&
x.rooms!==s.room
)
return false;

if(!areaMatch(x.areaNum))
return false;

if(!ageMatch(x.ageNum))
return false;

return true;

})

.slice(0,14);

}

function tags(){

return`

<div class="summary">

<span class="tag">
${esc(s.service)}
</span>

<span class="tag">
${esc(s.type)}
</span>

<span class="tag">
${esc(s.city)}
</span>

<span class="tag">
${esc(s.room)}
</span>

<span class="tag">
${esc(s.area)}
</span>

<span class="tag">
${esc(s.age)}
</span>

</div>

`;

}

function showResults(){

s.step=7;

document.getElementById('stepText').textContent=
'نتایج جست‌وجو';

document.getElementById('bar').style.width='100%';

document.getElementById('root').innerHTML=`

<div class="card">

<div class="resultsHead">

<div>

<div class="eyebrow">
AVRIN MATCH
</div>

<h2>
${fa(results.length)}
گزینه منطبق پیدا شد
</h2>

<p>
نتایج بر اساس معیارهای جستجوی شما انتخاب شده‌اند.
</p>

</div>

<button
class="btn secondary"
onclick="editSearch()">
ویرایش جستجو
</button>

</div>

<div class="formBox">

<div class="eyebrow">
راهنمایی و مشاوره
</div>

<div class="formTitle">
در صورت تمایل برای راهنمایی و مشاوره خرید یا اجاره، اطلاعات خود را وارد نمایید.
</div>

<p class="desc">
تکمیل این فرم کاملاً اختیاری است. اطلاعات واردشده به همراه معیارهای جستجو و آگهی‌های نمایش‌داده‌شده برای بررسی و مشاوره ارسال می‌شود.
</p>

<div class="formGrid">

<input
id="cname"
class="input"
type="text"
placeholder="نام و نام خانوادگی">

<input
id="cphone"
class="input"
type="tel"
inputmode="tel"
placeholder="شماره تلفن">

<input
id="cbirth"
class="input"
type="date"
title="تاریخ تولد">

<select
id="cresidence"
class="select">

<option value="">
شهر محل اقامت
</option>

${cities.map(x=>
`<option value="${esc(x)}">${esc(x)}</option>`
).join('')}

</select>

</div>

<div style="height:10px"></div>

<input
id="cemail"
class="input"
type="email"
placeholder="ایمیل">

<div class="turnstileBox">

${
TURNSTILE_SITEKEY==='YOUR_TURNSTILE_SITE_KEY'

?

`<div class="notice">
CAPTCHA هنوز فعال نشده است.
</div>`

:

`<div
class="cf-turnstile"
data-sitekey="${TURNSTILE_SITEKEY}"
data-theme="dark"
data-size="flexible"
data-action="property-request">
</div>`

}

</div>

<div class="actions">

<button
class="btn primary"
onclick="submitContact()">
ارسال اطلاعات
</button>

</div>

</div>

${tags()}

<div class="list">

${
results.length

?

results.map((x,i)=>`

<article
class="listing"
onclick="detail(${i})">

<div class="ltop">

<div class="ltitle">
${esc(x.title)}
</div>

<div class="price">
${esc(x.price)}
</div>

</div>

<div class="meta">

<span>
${esc(x.area||'متراژ نامشخص')}

async function submitContact(){

const name=
document.getElementById('cname').value.trim();

const phone=
document.getElementById('cphone').value.trim();

const birthDate=
document.getElementById('cbirth').value;

const residenceCity=
document.getElementById('cresidence').value;

const email=
document.getElementById('cemail').value.trim();

if(!name){

alert(
'لطفاً نام و نام خانوادگی را وارد کنید.'
);

return;

}

if(!phone&&!email){

alert(
'لطفاً شماره تلفن یا ایمیل را وارد کنید.'
);

return;

}

let turnstileToken='';

if(
TURNSTILE_SITEKEY!=='YOUR_TURNSTILE_SITE_KEY'
){

turnstileToken=
document.querySelector(
'[name="cf-turnstile-response"]'
)?.value||'';

if(!turnstileToken){

alert(
'لطفاً تأیید CAPTCHA را انجام دهید.'
);

return;

}

}

const lead={

user:{
name,
phone,
birthDate,
residenceCity,
email
},

search:{
service:s.service,
type:s.type,
city:s.city,
room:s.room,
area:s.area,
age:s.age
},

shownListings:
results.map(x=>({

id:x.id,
title:x.title,
price:x.price,
city:x.city,
district:x.district,
area:x.area,
rooms:x.rooms,
age:x.age,
link:x.link

})),

turnstileToken,

createdAt:
new Date().toISOString()

};

try{

if(
LEAD_ENDPOINT!=='YOUR_BACKEND_ENDPOINT'
){

const response=
await fetch(
LEAD_ENDPOINT,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(lead)
}
);

if(!response.ok)
throw new Error(
'خطا در ارسال اطلاعات'
);

}else{

const saved=
JSON.parse(
localStorage.getItem(
'avrin_leads'
)||'[]'
);

saved.push(lead);

localStorage.setItem(
'avrin_leads',
JSON.stringify(saved)
);

}

alert(
'اطلاعات شما با موفقیت ثبت شد.'
);

}catch(e){

alert(
'ارسال اطلاعات انجام نشد.'
);

}

}

render();

</script>

</body>
</html>
