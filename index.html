</head>

<body>

<main class="app">

<div class="wrap">

<header class="head">

<div class="brand">

<div class="logo">E</div>

<div>
<b>Evren Nexus</b>
<span>مشاور ملک اورین</span>
</div>

</div>

<div class="step" id="stepText">
مرحله ۱ از ۷
</div>

</header>

<div class="bar">
<i id="bar"></i>
</div>

<section id="root"></section>

</div>

</main>


<script>

const cities=[
"تهران",
"مشهد",
"تبریز",
"استانبول",
"ازمیر",
"آنتالیا"
];

const types=[
"مسکونی",
"تجاری",
"اداری",
"خدماتی",
"ورزشی",
"آموزشی",
"بهداشتی و درمانی",
"زمین",
"ویلا"
];

const rooms=[
"سوییت",
"تک خوابه",
"دو خوابه",
"سه خوابه و بیشتر"
];

const areas=[
"زیر۶۰",
"۶۰-۷۰",
"۷۰-۸۰",
"۸۰-۹۰",
"۹۰-۱۲۰",
"۱۲۰-۱۵۰",
"بزرگتر از ۱۵۰"
];

const areaLabels=[
"زیر ۶۰",
"۶۰-۷۰",
"۷۰-۸۰",
"۸۰-۹۰",
"۹۰-۱۲۰",
"۱۲۰-۱۵۰",
"بزرگتر از ۱۵۰"
];

const ages=[
"نوساز کلید نخورده",
"۱-۵ سال",
"۵-۱۰ سال",
"۱۰-۲۰ سال",
"بیشتر از ۲۰"
];

let s={
step:1,
username:"",
service:"",
type:"",
city:"",
room:"",
area:"",
age:"",
contactName:"",
contactPhone:"",
contactEmail:""
};

let results=[];
let editing=false;


function fa(n){
return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}


function updateHeader(){

document.getElementById("stepText").textContent=
s.step<=7
?`مرحله ${fa(s.step)} از ۷`
:"";

document.getElementById("bar").style.width=
(s.step<=7?s.step/7*100:100)+"%";

}


function render(){

updateHeader();

const root=document.getElementById("root");

if(s.step===1){
intro(root);
return;
}

if(s.step===2){

choices(
root,
"نوع خدمت",
"برای شروع، نوع خدمت مورد نظر خود را انتخاب نمایید:",
[
["خرید ملک","خرید"],
["اجاره ملک","اجاره"]
],
"service"
);

return;
}

if(s.step===3){

choices(
root,
"نوع ملک",
"نوع ملک مورد نظر خود را انتخاب نمایید:",
types.map(x=>[x,x]),
"type"
);

return;
}

if(s.step===4){

choices(
root,
"شهر",
s.service==="خرید"
?"لطفا شهر مورد نظر خود برای خرید را انتخاب نمایید:"
:"لطفا شهر مورد نظر خود برای اجاره را انتخاب نمایید:",
cities.map(x=>[x,x]),
"city"
);

return;
}

if(s.step===5){

choices(
root,
"تعداد اتاق",
"تعداد اتاق خواب مورد نظر را انتخاب نمایید:",
rooms.map(x=>[x,x]),
"room"
);

return;
}

if(s.step===6){

choices(
root,
"متراژ",
"متراژ مورد نظر خود را انتخاب نمایید:",
areas.map((x,i)=>[areaLabels[i],x]),
"area"
);

return;
}

if(s.step===7){

choices(
root,
"سن بنا",
"سن بنای مورد نظر خود را انتخاب نمایید:",
ages.map(x=>[x,x]),
"age"
);

return;
}

}


function intro(root){

root.innerHTML=`

<div class="card">

<div class="eyebrow">
EVREN NEXUS · AVRIN
</div>

<h1 class="title">
سلام، من مشاور ملک اورین هستم.
</h1>

<p class="desc">

هدف من این است که با استفاده از اطلاعات بازار و تحلیل داده‌ها،
به شما برای انتخاب مناسب‌ترین گزینه در خرید یا اجاره ملک کمک کنم.

<br>

این خدمات در حال حاضر رایگان ارائه می‌شود.

<br><br>

برای شروع، لطفاً یک نام کاربری برای خود انتخاب کنید.

نام کاربری می‌تواند فارسی یا انگلیسی باشد و هیچ محدودیت تعداد کاراکتر ندارد.

</p>

<input
id="u"
class="input"
value="${escapeHtml(s.username)}"
placeholder="نام کاربری خود را وارد کنید"
oninput="s.username=this.value;document.getElementById('count').textContent=this.value.length+' کاراکتر'"
>

<div id="count" class="counter">
${s.username.length} کاراکتر
</div>

<div class="actions">

<button
class="btn primary"
onclick="nextUser()">

شروع مشاوره

</button>

</div>

</div>

`;

}


function choices(root,eyebrow,description,items,key){

let back="";

if(s.step>1){

back=`
<button
class="btn secondary"
onclick="prevStep()">
بازگشت
</button>
`;

}

root.innerHTML=`

<div class="card">

<div class="eyebrow">
${eyebrow}
</div>

<h1 class="title">
${description}
</h1>

<div class="grid">

${items.map(item=>`

<button
class="choice ${s[key]===item[1]?"selected":""}"
onclick='pick(${JSON.stringify(key)},${JSON.stringify(item[1])})'>

${escapeHtml(item[0])}

</button>

`).join("")}

</div>

<div class="actions">

${back}

${editing?`
<button
class="btn secondary"
onclick="showResults()">
بازگشت به نتایج
</button>
`:""}

</div>

</div>

`;

}


function nextUser(){

if(!s.username.trim()){

alert("لطفاً یک نام کاربری وارد کنید.");

return;

}

s.username=s.username.trim();

s.step=2;

editing=false;

render();

}


function pick(key,value){

s[key]=value;

if(key==="service"){

s.type="";
s.city="";
s.room="";
s.area="";
s.age="";

}

if(key==="type"){

s.city="";
s.room="";
s.area="";
s.age="";

}

if(key==="city"){

s.room="";
s.area="";
s.age="";

}

if(key==="room"){

s.area="";
s.age="";

}

if(key==="area"){

s.age="";

}

s.step++;

if(s.step===8){

searching();

}else{

render();

}

}


function prevStep(){

if(s.step>1 && s.step<=7){

s.step--;

render();

}

}


function searching(){

document.getElementById("stepText").textContent=
"در حال جست‌وجو";

document.getElementById("bar").style.width="100%";

document.getElementById("root").innerHTML=`

<div class="card loading">

<div class="spinner"></div>

<h2>
در حال بررسی گزینه‌های منطبق...
</h2>

<p class="desc">

اورین در حال آماده‌سازی گزینه‌ها بر اساس
اطلاعات انتخاب‌شده شماست.

</p>

</div>

`;

setTimeout(()=>{

results=makeResults();

showResults();

},700);

}


function makeResults(){

const neighborhoods={

"تهران":[
"سعادت‌آباد",
"پونک",
"تهرانپارس",
"نارمک",
"یوسف‌آباد",
"جنت‌آباد"
],

"مشهد":[
"سجاد",
"احمدآباد",
"وکیل‌آباد",
"قاسم‌آباد",
"الهیه"
],

"تبریز":[
"ولیعصر",
"ائل‌گلی",
"آبرسان",
"رشدیه",
"مقصودیه"
],

"استانبول":[
"کادیکوی",
"باکیرکوی",
"آتاشهیر",
"بیلیک‌دوزو",
"بشیکتاش"
],

"ازمیر":[
"کارشیاکا",
"بورنوا",
"بالچووا",
"کناک"
],

"آنتالیا":[
"کنیالتی",
"لارا",
"مرادپاشا",
"کپز"
]

};

const areaMap={

"زیر۶۰":[45,50,55],

"۶۰-۷۰":[62,65,68],

"۷۰-۸۰":[72,75,78],

"۸۰-۹۰":[82,85,88],

"۹۰-۱۲۰":[92,100,108,115],

"۱۲۰-۱۵۰":[125,135,145],

"بزرگتر از ۱۵۰":[160,180,210]

};

const ageMap={

"نوساز کلید نخورده":[0],

"۱-۵ سال":[1,2,3,4,5],

"۵-۱۰ سال":[5,6,7,8,9,10],

"۱۰-۲۰ سال":[10,12,15,18,20],

"بیشتر از ۲۰":[21,25,30,35]

};

const selectedAreas=
areaMap[s.area]||[90,100,110];

const selectedAges=
ageMap[s.age]||[5,7,9];

const ns=
neighborhoods[s.city]||["مرکزی","شمالی","جنوبی"];

const output=[];

for(let i=0;i<14;i++){

const area=
selectedAreas[i%selectedAreas.length];

const age=
selectedAges[i%selectedAges.length];

const neighborhood=
ns[i%ns.length];

let price;

if(
s.city==="استانبول"||
s.city==="ازمیر"||
s.city==="آنتالیا"
){

price=
Math.round(
70000+
area*900+
i*2500
);

}else if(s.city==="تهران"){

price=
(area*.09+i*.12).toFixed(1);

}else if(s.city==="مشهد"){

price=
(area*.055+i*.08).toFixed(1);

}else{

price=
(area*.05+i*.07).toFixed(1);

}

output.push({

id:i+1,

title:
`${s.type} ${s.room} ${area} متر در ${neighborhood} ${s.city}`,

price:
(
s.city==="استانبول"||
s.city==="ازمیر"||
s.city==="آنتالیا"
)
?fa(price)+" دلار"
:fa(price)+" میلیارد تومان",

area:
fa(area)+" متر",

age:
age===0
?"نوساز کلید نخورده"
:fa(age)+" سال",

city:s.city,

type:s.type,

neighborhood,

rooms:s.room,

areaNum:area,

ageNum:age,

text:
`این گزینه بر اساس مشخصات جست‌وجوی شما انتخاب شده است.

شهر: ${s.city}

نوع ملک: ${s.type}

محله: ${neighborhood}

متراژ: ${area} متر

تعداد اتاق: ${s.room}

سن بنا: ${age===0?"نوساز":age+" سال"}

در نسخه نهایی، این اطلاعات از آرشیو آگهی‌های واقعی دریافت خواهد شد.`,

link:"#",

source:"داده نمونه AVRIN"

});

}

return output;

}


function tags(){

return `

<div class="summary">

<span class="tag">${s.service}</span>

<span class="tag">${s.type}</span>

<span class="tag">${s.city}</span>

<span class="tag">${s.room}</span>

<span class="tag">${areaLabels[areas.indexOf(s.area)]}</span>

<span class="tag">${s.age}</span>

</div>

`;

}


function showResults(){

s.step=8;

document.getElementById("stepText").textContent=
"نتایج جست‌وجو";

document.getElementById("bar").style.width="100%";

document.getElementById("root").innerHTML=`

<div class="card">

<div class="resultsHead">

<div>

<div class="eyebrow">
AVRIN MATCH
</div>

<h2>
${fa(results.length)} گزینه منطبق پیدا شد
</h2>

<p>
در نسخه فعلی این نتایج نمونه هستند.
</p>

</div>

<button
class="btn secondary"
onclick="editSearch()">

ویرایش جست‌وجو

</button>

</div>

${tags()}

<div class="list">

${results.map(x=>`

<article
class="listing"
onclick="detail(${x.id})">

<div class="ltop">

<div class="ltitle">
${x.title}
</div>

<div class="price">
${x.price}
</div>

</div>

<div class="meta">

<span>${x.area}</span>
<span>${x.rooms}</span>
<span>${x.age}</span>
<span>${x.city}</span>
<span>${x.neighborhood}</span>

</div>

<div class="excerpt">
این گزینه بر اساس مشخصات جست‌وجوی شما انتخاب شده است.
</div>

<div class="source">
${x.source}
</div>

</article>

`).join("")}

</div>

<div class="notice">

پس از اتصال به آرشیو واقعی،
اورین حداکثر ۱۴ آگهی منطبق را از میان
داده‌های موجود انتخاب خواهد کرد.

</div>

<div class="actions">

<button
class="btn primary"
onclick="showContact()">

دریافت مشاوره دقیق‌تر

</button>

</div>

</div>

`;

}


function detail(id){

const x=results.find(a=>a.id===id);

if(!x)return;

document.getElementById("stepText").textContent=
"جزئیات گزینه";

document.getElementById("root").innerHTML=`

<div class="card detail">

<button
class="btn secondary back"
onclick="showResults()">

← بازگشت به نتایج

</button>

<div class="eyebrow">
جزئیات گزینه
</div>

<h1 class="title">
${x.title}
</h1>

<div
class="price"
style="font-size:18px">

${x.price}

</div>

<div class="detailGrid">

<div class="detailItem">
<b>شهر</b>
<span>${x.city}</span>
</div>

<div class="detailItem">
<b>محله</b>
<span>${x.neighborhood}</span>
</div>

<div class="detailItem">
<b>متراژ</b>
<span>${x.area}</span>
</div>

<div class="detailItem">
<b>اتاق</b>
<span>${x.rooms}</span>
</div>

<div class="detailItem">
<b>سن بنا</b>
<span>${x.age}</span>
</div>

function saveContact(){

const name=
document.getElementById("cname").value.trim();

const phone=
document.getElementById("cphone").value.trim();

const email=
document.getElementById("cemail").value.trim();

const error=
document.getElementById("contactError");

if(!phone&&!email){

error.innerHTML=`

<div class="warning">

لطفاً حداقل شماره تلفن یا ایمیل را وارد کنید.

</div>

`;

return;

}

if(
email&&
!/^\\S+@\\S+\\.\\S+$/.test(email)
){

error.innerHTML=`

<div class="warning">

فرمت ایمیل صحیح نیست.

</div>

`;

return;

}

const lead={

id:"AVRIN-"+Date.now(),

createdAt:new Date().toISOString(),

username:s.username,

name:name,

phone:phone,

email:email,

search:{

service:s.service,

propertyType:s.type,

city:s.city,

rooms:s.room,

area:s.area,

age:s.age

},

shownListings:results.map(x=>({

id:x.id,

title:x.title,

price:x.price,

area:x.area,

age:x.age,

city:x.city,

type:x.type,

neighborhood:x.neighborhood,

rooms:x.rooms,

link:x.link

}))

};

let leads=[];

try{

leads=
JSON.parse(
localStorage.getItem("avrin_leads")||"[]"
);

}catch(e){

leads=[];

}

leads.push(lead);

localStorage.setItem(
"avrin_leads",
JSON.stringify(leads)
);

document.getElementById("stepText").textContent=
"ثبت شد";

document.getElementById("root").innerHTML=`

<div class="card">

<div class="eyebrow">
AVRIN
</div>

<h1 class="title">
اطلاعات شما ثبت شد
</h1>

<p class="desc">

اطلاعات تماس،
مشخصات جست‌وجو و
گزینه‌های نمایش‌داده‌شده ثبت شد.

</p>

<div class="notice">

${fa(results.length)}
گزینه برای این جست‌وجو ثبت شد.

</div>

<div class="actions">

<button
class="btn primary"
onclick="showResults()">

بازگشت به نتایج

</button>

</div>

</div>

`;

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


render();

</script>
