<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avrin Property Advisor</title>
<style>
body{margin:0;background:#071018;color:#eef5f8;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 12px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:18px;font-weight:bold}.sub{font-size:11px;color:#91a4b4;margin-top:5px}.panel{background:#101a24;border:1px solid #263746;border-radius:16px;padding:18px;margin-bottom:16px}.form{display:flex;gap:10px;align-items:end;max-width:430px}.field{flex:1}.field label{display:block;color:#91a4b4;font-size:11px;margin-bottom:6px}.field input{width:100%;height:44px;box-sizing:border-box;background:#0a131c;color:#fff;border:1px solid #2b3d4c;border-radius:9px;padding:0 10px;font:inherit}.btn{height:44px;border:0;border-radius:9px;padding:0 20px;background:#46c6a7;color:#07120f;font-weight:bold;font-family:inherit;cursor:pointer}.status{text-align:center;padding:35px 10px}.spin{width:30px;height:30px;border:3px solid #294052;border-top-color:#46c6a7;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}.error{color:#ffb4b4;white-space:pre-wrap;line-height:2}.summary{color:#b9c8d5;font-size:12px;margin-bottom:14px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#0b141d;border:1px solid #293b4b;border-radius:14px;overflow:hidden}.photo{height:190px;background:#101b25}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.row{display:flex;justify-content:space-between;gap:10px}.title{font-weight:bold;line-height:1.7}.price{color:#46c6a7;font-weight:bold;white-space:nowrap}.meta{color:#aebdca;font-size:11px;line-height:2;margin-top:9px}.link{margin-top:9px;font-size:10px}.link a{color:#8ca6b8}@media(max-width:700px){.list{grid-template-columns:1fr}.form{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="head"><div><div class="brand">Avrin Property Advisor</div><div class="sub">موتور جستجوی املاک Evren Nexus</div></div><div id="count"></div></header>
<section class="panel">
<div class="form"><div class="field"><label>بودجه (میلیارد تومان)</label><input id="budget" type="number" min="1" max="999" step=".1" placeholder="مثلاً 10"></div><button class="btn" id="search">بیاب</button></div>
</section>
<div id="status" class="panel status"><div class="spin"></div>صفحه در حال لود شدن می باشد، لطفا تأمل بفرمایید</div>
<div id="results"></div>
</div>
<script>
"use strict";
const statusEl=document.getElementById("status"),resultsEl=document.getElementById("results"),countEl=document.getElementById("count"),budgetEl=document.getElementById("budget");
function fa(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function money(n){return n>=1e9?fa((n/1e9).toLocaleString("fa-IR",{maximumFractionDigits:2}))+" میلیارد تومان":fa((n/1e6).toLocaleString("fa-IR",{maximumFractionDigits:0}))+" میلیون تومان"}
function image(x){return Array.isArray(x.images)?(x.images.find(u=>typeof u==="string"&&/^https?:\/\/s\d+\.divarcdn\.com\/static\/photo\//i.test(u))||""):""}
function error(msg){statusEl.innerHTML='<div class="error">خطا در بارگذاری آرشیو:\n'+safe(msg)+'</div>'}
async function load(){
 try{
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),10000);
  const res=await fetch("./data/listings.json",{cache:"no-store",signal:ctl.signal});
  clearTimeout(timer);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const text=await res.text();
  if(!text.trim())throw new Error("فایل آرشیو خالی است");
  let data;
  try{data=JSON.parse(text)}catch(e){throw new Error("JSON نامعتبر: "+text.slice(0,180))}
  if(!Array.isArray(data))throw new Error("ساختار listings.json آرایه نیست");
  const q=new URLSearchParams(location.search),b=Number(q.get("budget"));
  if(b>=1&&b<=999)budgetEl.value=b;
  const min=b*900000000,max=b*1100000000;
  const items=data.filter(x=>x&&x.sellerType==="personal"&&(!Number.isFinite(Number(x.ageHours))||Number(x.ageHours)<=336)&&(!b||((Number(x.price)>=min)&&(Number(x.price)<=max))));
  countEl.textContent=fa(items.length)+" نتیجه";
  statusEl.style.display="none";
  resultsEl.innerHTML='<section class="panel"><div class="summary">'+(b?"بودجه "+fa(b)+" میلیارد تومان · بازه ±۱۰٪":"همه آگهی‌های معتبر")+" · فقط خرید · فروشنده شخصی · حداکثر ۱۴ روز</div><div class="list">'+(items.length?items.map(card).join(""):'<div>در این بازه آگهی منطبق پیدا نشد.</div>')+'</div></section>';
 }catch(e){
  error(e.name==="AbortError"?"زمان دریافت آرشیو بیش از ۱۰ ثانیه طول کشید":(e.message||String(e)));
 }
}
function card(x){
 const im=image(x);
 return '<article class="card">'+(im?'<div class="photo"><img src="'+safe(im)+'" loading="lazy"></div>':'')+'<div class="body"><div class="row"><div class="title">'+safe(x.displayTitle||"آگهی ملک")+'</div><div class="price">'+money(Number(x.price)||0)+'</div></div><div class="meta">'+[x.city,x.neighborhood,x.area?x.area+" متر":"",x.rooms!=null?x.rooms+" خوابه":"",x.buildYear?"ساخت "+x.buildYear:"",x.floor?"طبقه "+x.floor:""].filter(Boolean).map(safe).join(" · ")+'</div><div class="link"><a href="'+safe(x.sourceUrl||"#")+'" target="_blank" rel="noopener">مشاهده آگهی اصلی</a></div></div></article>'
}
document.getElementById("search").onclick=()=>{const b=Number(budgetEl.value);if(b>=1&&b<=999)location.href="?budget="+encodeURIComponent(b)};
budgetEl.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("search").click()});
load();
</script>
</body>
</html>
